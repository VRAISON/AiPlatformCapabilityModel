<script>
var DATA={"name":"AI Platform Capability Model","version":"v3","generated":"2026-10-18","license":"CC BY 4.0","actors":["User","Editor","Operating system","Vendor service","Model provider","Git host","Chat platform","Package author","Organization admin"],"areas":[{"id":"BA1","name":"Session & Turn","hue":1,"slug":"session-and-turn","icon":"icons/area-session-and-turn.png","description":"Ability to hold a conversation with the agent as a durable, resumable record, run each turn inside it under the user's control, and recover it after interruption, across every surface the platform offers.","scope":"Covers the session record, the turn loop, in-flight control, continuity, and recovery. Excludes what the agent is told before a turn (Memory) and what it is allowed to do during one (Authority & Configuration).","capabilities":[{"id":"BA1.01","name":"Session Store","slug":"session-store","icon":"icons/cap-session-store.png","description":"Ability to record every conversation durably, bound to a workspace, with its transcript, attachments, and external references, so it can be found and reopened later.","scope":"Inside: the catalog entry, the transcript, the workspace binding, attachments, and typed references. Excludes resuming or searching the record (Continuity) and the turn that writes it (Turn Loop).","owner":"Session runtime team","services":[{"id":"BA1.01.01","name":"Session Catalog","slug":"session-catalog","pattern":"Register","asset":"Session","prevalence":"wide","evidence":"Cx threads · Cl projects · Cp session-store · Ge history · Ag Gk He Qw","description":"A searchable list of every conversation, with identity and timestamps.","platforms":["Cx","Cl","Cp","Ge","Ag","Gk","He","Qw"],"profile":{"inside":"The list of conversations: one entry per session with its identity, workspace, title, repository, and timestamps, indexed for listing and lookup.","excludes":"The transcript's content (Transcript Log), which sessions are open (Resume Set), and full-text search over turns (Session Search).","purpose":"Lets a person or program find any past conversation and lets every other session service key its data to a stable session identity.","functions":[["Register session","Creates the entry when a session starts, assigning its identifier and recording the workspace it is bound to."],["List and look up","Returns sessions by workspace, repository, recency, or identifier for the command line, the editor, and protocol clients."],["Update summary","Keeps the title, turn count, and last-activity time current as turns complete."]],"entities":[["Session","One conversation. Attributes: session id, workspace path, repository, branch, title or summary, client name, created and updated timestamps, turn count, fork count."],["Catalog Index","The lookup structure over sessions. Attributes: keys by workspace, repository, and recency."]],"inbound":[["Turn Execution","event record","creates the entry on the first turn and updates summary fields as turns complete"],["Workspace Binding","in-process call","supplies the workspace path the session is keyed to"],["Session Fork","in-process call","registers the child session and links it to its parent"]],"outbound":[["Resume Set","catalog query","the sessions to reopen on restart"],["Session Search","catalog query","the session identities the search index is keyed to"],["Fleet Console","catalog query","the running and recent sessions to display"]],"security":"Entries name local paths and repositories, so the catalog is user-private and never leaves the machine except through Transcript Export or Audit Export.","storage":"A single local index file or database in the platform home, one per user.","performance":"Listing stays under 100 ms at 10,000 sessions; a lookup by identifier is constant time."}},{"id":"BA1.01.02","name":"Transcript Log","slug":"transcript-log","pattern":"Maintain","asset":"Transcript","prevalence":"wide","evidence":"Cx · Cl jsonl · Cp events.jsonl · Ge Qw chats · Ag steps · He messages","description":"The append-only record of what was said and done in a session.","platforms":["Cx","Cl","Cp","Ge","Ag","Gk","He","Qw"],"profile":{"inside":"The ordered, append-only record of every message, tool call, tool result, permission event, and lifecycle event in a session.","excludes":"The session's identity and summary (Session Catalog), summaries written over the log (Progress Checkpoint), and its portable copy (Transcript Export).","purpose":"Gives the session a complete, replayable history that resume, search, audit, and compaction all read from.","functions":[["Append event","Writes one typed event at the end of the log with a timestamp and turn index."],["Replay","Returns the events of a session in order so a client can rebuild its view or resume the model's context."],["Rotate and seal","Closes a log on session end and protects it from edits."]],"entities":[["Transcript Event","One entry. Attributes: sequence, turn index, timestamp, type (user message, assistant message, tool call, tool result, permission, lifecycle), payload."],["Transcript","The ordered set of events for one session. Attributes: session id, event count, first and last timestamps."]],"inbound":[["Turn Execution","event record","appends user, assistant, model, and lifecycle events as the turn runs"],["Tool Call Dispatch","event record","appends tool call and tool result events"],["Permission Stream","event record","appends permission requested and completed events"]],"outbound":[["Resume Set","file read","the events needed to rebuild context on resume"],["Session Search","file read","the text to index"],["Context Compaction","file read","older turns to summarize"],["Audit Export","file read","the record an auditor receives"]],"security":"Contains everything the user and tools said, including pasted content, so it is user-private; Secret Redaction runs before anything is written.","storage":"One append-only file per session in the platform home, line-oriented so a crash loses at most the last event.","performance":"Append is a single write under 5 ms; replay of a 10,000-event session completes under one second."}},{"id":"BA1.01.03","name":"Workspace Binding","slug":"workspace-binding","pattern":"Register","asset":"Workspace","prevalence":"wide","evidence":"cwd on Cx Cl Cp Ge Ag Gk He Qw","description":"The directory a session acts in, recorded so it can be resumed in place.","platforms":["Cx","Cl","Cp","Ge","Ag","Gk","He","Qw"],"profile":{"inside":"The association between a session and the directory it acts in, including how that directory is encoded in paths and keys.","excludes":"Whether the directory is trusted (Workspace Trust) and the repository's git state (Repository State).","purpose":"Makes a session resumable in place and lets every per-project store find its data by the same key.","functions":[["Bind on start","Records the working directory when a session begins."],["Resolve key","Maps a directory to the stable key used by project memory, settings, and the catalog."],["Rebind","Updates the binding when a session is moved or its directory is renamed."]],"entities":[["Workspace","A directory a session acts in. Attributes: absolute path, encoded key, repository root if any."]],"inbound":[["Command Line","in-process call","the directory the client was launched in"],["IDE Attach","protocol message","the editor's open workspace folders"]],"outbound":[["Session Catalog","in-process call","the workspace path stored on the entry"],["Project Settings","key lookup","the key that selects per-project configuration"],["Memory Index","key lookup","the key that selects per-project memory"],["Workspace Trust","in-process call","the folder to check before tools run"]],"security":"A binding is a path, not a grant; it confers no permission by itself.","storage":"Stored on the catalog entry and encoded into the names of per-project directories.","performance":"Resolution is a pure function of the path; no I/O."}},{"id":"BA1.01.04","name":"Attachment Store","slug":"attachment-store","pattern":"Maintain","asset":"Attachment","prevalence":"rare","evidence":"Cp session files/ · Cp chats scratch dir","description":"Files a session attached or produced, kept beside the transcript.","platforms":["Cp"],"profile":{"inside":"Files a session attached, pasted, or produced that are kept beside its transcript, including the scratch directory of a session with no workspace.","excludes":"Files edited in the workspace (File Edit, Edit Attribution) and memory notes (Topic Note).","purpose":"Keeps a session's non-transcript material addressable so a resume or export can bring it back.","functions":[["Store attachment","Saves a pasted or uploaded file under the session and returns a reference."],["Materialize","Writes a model-produced file to the session's directory."],["Provide scratch directory","Creates a working directory for sessions that have no workspace."]],"entities":[["Attachment","One stored file. Attributes: session id, name, content type, size, origin (pasted, uploaded, produced), path."]],"inbound":[["Multimodal Input","file write","images and screenshots pasted into a turn"],["Turn Execution","file write","files the model produced"]],"outbound":[["Prompt Assembly","file read","attachment content referenced by a turn"],["Transcript Export","file read","attachments bundled with the export"]],"security":"Attachments may contain user data; they inherit the session's privacy and are removed with it.","storage":"A directory per session in the platform home.","performance":"Bounded by disk; a single attachment is limited to what the model can consume in one turn."}},{"id":"BA1.01.05","name":"External Reference","slug":"external-reference","pattern":"Register","asset":"Reference","prevalence":"rare","evidence":"Cp session_refs: issues, PRs","description":"Issues, pull requests, and other typed links attached to a turn.","platforms":["Cp"],"profile":{"inside":"Typed links from a turn to things outside the session: issues, pull requests, documents, tickets.","excludes":"The pull request the agent itself opens (Pull Request Flow) and intake of an issue as work (Issue Intake).","purpose":"Lets a session record what it was about so the record can be found from the issue tracker side and so context can be re-fetched on resume.","functions":[["Attach reference","Records a typed reference with its identifier at a turn index."],["Resolve","Fetches the referenced object's current state through the host's interface when context is needed."],["List by reference","Finds sessions that touched a given issue or pull request."]],"entities":[["Reference","One link. Attributes: session id, turn index, type (issue, pull request, document), host, identifier, URL, title."]],"inbound":[["Turn Execution","in-process call","references mentioned or fetched during a turn"],["Issue Intake","in-process call","the issue a run was started from"]],"outbound":[["Prompt Assembly","reference read","the current state of a referenced object"],["Session Catalog","catalog query","references shown with the session"]],"security":"A reference holds an identifier, not the object's content; access to the object is checked by the host at resolve time.","storage":"A table or list keyed by session in the platform home.","performance":"Resolution is a network call to the host and is cached for the turn."}}]},{"id":"BA1.02","name":"Turn Loop","slug":"turn-loop","icon":"icons/cap-turn-loop.png","description":"Ability to execute one turn end to end: accept a prompt, call the model, dispatch tool calls, and return a response, with every step recorded.","scope":"Inside: the turn cycle and tool-call dispatch. Excludes the prompt's assembly (Briefing), the permission to run a tool (Execution Control), and the tools themselves (Native Tools).","owner":"Agent runtime team","services":[{"id":"BA1.02.01","name":"Turn Execution","slug":"turn-execution","pattern":"Fulfill","asset":"Turn","prevalence":"wide","evidence":"prompt in, model call, tool calls, response out · Cp turns table · Cx threads · Ag steps · AHP chat channel","description":"One cycle of prompt, model call, tool calls, and response.","platforms":["Cx","Cl","Cp","Ge","Ag","Gk","He","Qw"],"profile":{"inside":"One full cycle: accept the assembled prompt, call the model, loop on tool calls until the model yields, and return the final response, recording each step.","excludes":"How the prompt is assembled (Prompt Assembly), how a tool call is routed (Tool Call Dispatch), and in-flight control (Turn Control).","purpose":"Is the unit of work every other service exists to prepare, bound, or record; the platform's core loop.","functions":[["Start turn","Opens a turn against a session with the user's message and the assembled prompt."],["Run model loop","Calls the model, hands tool requests to dispatch, feeds results back, and repeats until a final answer."],["Finish turn","Emits the final response, usage, and a lifecycle event, and returns control to the surface."]],"entities":[["Turn","One request-response cycle. Attributes: session id, turn index, user message, assistant response, model, start and end timestamps, token usage, finish reason."],["Model Call","One request to the model inside a turn. Attributes: turn index, call index, latency, cached tokens, reasoning effort."]],"inbound":[["Command Line","in-process call","the user's message that starts a turn"],["Headless Run","in-process call","the prompt of a non-interactive run"],["Prompt Assembly","in-process call","the assembled request"],["Follow-up Queue","in-process call","the next queued message after a turn ends"],["Model Selection","config read","which model to call"]],"outbound":[["Transcript Log","event record","every message and lifecycle event"],["Tool Call Dispatch","in-process call","each tool request from the model"],["Usage Account","event record","tokens and cost per call"],["Session Catalog","event record","summary updates when the turn completes"]],"security":"Runs only inside a trusted workspace under the current Approval Mode; never bypasses dispatch to run a tool directly.","storage":"Holds state in memory for the duration of the turn; durable state is the transcript.","performance":"First token from the model within the provider's latency; the loop adds under 50 ms per tool round trip."}},{"id":"BA1.02.02","name":"Tool Call Dispatch","slug":"tool-call-dispatch","pattern":"Process","asset":"Tool Call","prevalence":"wide","evidence":"Cp tool.execution events, tool-call tracker · Ag steps · ACP tool_call updates · every CLI","description":"Routing a model's tool request to the right tool and returning the result.","platforms":["Cx","Cl","Cp","Ge","Ag","Gk","He","Qw"],"profile":{"inside":"Receiving a tool request from the model, resolving the tool, checking permission, invoking it, and returning a result the model can read.","excludes":"The tools themselves (Native Tools, MCP Server) and the policy decision (Approval Mode, Remembered Grant).","purpose":"Keeps a single, auditable path between the model's intent and anything that touches the machine.","functions":[["Resolve tool","Matches the requested name to a native tool, a skill, or an MCP server's tool."],["Gate","Asks Execution Control whether the call may run and records the answer."],["Invoke and return","Runs the tool with its arguments, applies output limits, and returns the result with an event record."]],"entities":[["Tool Call","One invocation. Attributes: turn index, call id, tool name, arguments, permission outcome, start and end timestamps, result size, status."],["Tool Registry","The set of callable tools. Attributes: name, source (native, skill, MCP), schema."]],"inbound":[["Turn Execution","in-process call","a tool request from the model"],["MCP Server","protocol message","tool definitions and results from configured servers"],["Lifecycle Hook","hook event","pre- and post-tool hooks that may block or amend the call"]],"outbound":[["Approval Mode","in-process call","the question of whether to ask"],["Permission Stream","event record","each request and its answer"],["Shell Execution","in-process call","a shell tool invocation"],["File Edit","in-process call","a file tool invocation"],["Transcript Log","event record","tool call and result events"]],"security":"No tool runs without passing the gate; arguments are logged with Secret Redaction applied.","storage":"Stateless; the record lives in the transcript and the permission stream.","performance":"Dispatch overhead under 10 ms; tool output truncated to a fixed limit before it reaches the model."}}]},{"id":"BA1.03","name":"Turn Control","slug":"turn-control","icon":"icons/cap-turn-control.png","description":"Ability to interrupt, steer, question, and cap a turn while it runs, from the keyboard or over a protocol, without losing the session.","scope":"Inside: interrupt, mid-turn steering, questions to the user, and run limits. Excludes limits set by a plan or goal (Planning) and approvals of individual actions (Execution Control).","owner":"Agent runtime team","services":[{"id":"BA1.03.01","name":"Turn Interrupt","slug":"turn-interrupt","pattern":"Operate","asset":"Turn","prevalence":"wide","evidence":"Cl stream-json interrupt · Cx turn/interrupt · Cp SDK abort() · ACP session/cancel · AHP chat/turnCancelled","description":"Stopping a running turn cleanly, from the keyboard or over a protocol.","platforms":["Cx","Cl","Cp","Ge","Ag","Gk","He","Qw"],"profile":{"inside":"Stopping a running turn cleanly on request: cancelling the model call, stopping tools, and leaving the session consistent.","excludes":"Steering without stopping (Message Steering) and limits that stop a run automatically (Run & Spend Limit).","purpose":"Gives the user and any client a reliable way to stop the agent without corrupting the session.","functions":[["Receive interrupt","Accepts a stop from the keyboard, a protocol message, or an SDK call."],["Cancel in flight","Aborts the model stream and signals running tools to stop."],["Settle","Records a cancelled lifecycle event and returns the session to idle."]],"entities":[["Interrupt","One stop request. Attributes: session id, turn index, source (keyboard, protocol, SDK), timestamp, outcome."]],"inbound":[["Command Line","key press","the user stops the turn"],["Agent Protocol Server","protocol message","a client cancels the turn"],["Embeddable SDK","in-process call","host code aborts the turn"]],"outbound":[["Turn Execution","in-process call","the cancellation signal"],["Transcript Log","event record","the cancelled lifecycle event"]],"security":"Any party that can start a turn may stop it; no elevated right is needed.","storage":"None beyond the transcript event.","performance":"Acknowledged within 100 ms; running tools are given a bounded grace period before being killed."}},{"id":"BA1.03.02","name":"Message Steering","slug":"message-steering","pattern":"Process","asset":"Inbound Message","prevalence":"rare","evidence":"AHP steering pending messages · Cl stream-json input mid-turn · Cl Cp hook additionalContext","description":"Injecting guidance into a turn that is already running.","platforms":["Cl","Cp"],"profile":{"inside":"Delivering an additional user message or hook-supplied context into a turn that is already running, so the model sees it at the next step.","excludes":"Stopping the turn (Turn Interrupt) and messages that wait for the turn to end (Follow-up Queue).","purpose":"Lets the user correct course mid-turn instead of stopping and restarting.","functions":[["Queue steering message","Accepts a message while a turn is running and marks it pending."],["Inject at next step","Adds the pending message to the model's context before the next model call."],["Record","Logs the message as a user event in the transcript."]],"entities":[["Pending Message","A message awaiting injection. Attributes: session id, turn index, text, source (user, hook), queued and delivered timestamps."]],"inbound":[["Command Line","in-process call","a message typed during a turn"],["Agent Protocol Server","protocol message","a client sends input mid-turn"],["Lifecycle Hook","hook event","additional context from a hook"]],"outbound":[["Turn Execution","in-process call","the message to inject before the next model call"],["Transcript Log","event record","the injected message"]],"security":"Hook-supplied context is marked by origin so the model can tell it from the user's words.","storage":"In-memory queue for the turn.","performance":"Injected before the next model call; never delays the current call."}},{"id":"BA1.03.03","name":"Human Input Request","slug":"human-input-request","pattern":"Agree","asset":"Question","prevalence":"rare","evidence":"Cl AskUserQuestion, Elicitation hook · ACP session/request_permission · AHP chat/inputRequested","description":"The agent pausing to ask the user a question or for a decision.","platforms":["Cl","Cp"],"profile":{"inside":"The agent pausing a turn to ask the user a question or present a choice, and resuming with the answer.","excludes":"Permission prompts for individual tool calls (Permission Stream) and steering the user initiates (Message Steering).","purpose":"Lets the agent resolve ambiguity with the user instead of guessing.","functions":[["Raise question","Presents a question with optional structured choices and suspends the turn."],["Collect answer","Receives the user's answer from the surface and validates it against the choices."],["Resume","Feeds the answer into the turn as a user message."]],"entities":[["Input Request","One question. Attributes: session id, turn index, prompt text, choices, answer, raised and answered timestamps, source surface."]],"inbound":[["Turn Execution","in-process call","the model asks a question"],["Command Line","in-process call","the user's answer"],["Agent Protocol Server","protocol message","a client's answer to an input request"]],"outbound":[["Command Line","in-process call","the question to render"],["Desktop & Push Notification","in-process call","a notice that the agent is waiting"],["Transcript Log","event record","the question and answer"]],"security":"The answer is user input and is treated as such; a headless run with no surface to ask must fail the request rather than invent an answer.","storage":"Transcript only.","performance":"The turn waits indefinitely by default; a run limit may time it out."}},{"id":"BA1.03.04","name":"Run & Spend Limit","slug":"run-and-spend-limit","pattern":"Allocate","asset":"Budget","prevalence":"mixed","evidence":"Cl --max-budget-usd · Qw --max-session-turns, --max-wall-time, --max-tool-calls · Ag --print-timeout","description":"A cap on turns, time, tool calls, or money for one run.","platforms":["Cl","Ag","Qw"],"profile":{"inside":"Caps on one run: maximum turns, wall time, tool calls, or spend, enforced while the run executes.","excludes":"The goal a run serves (Goal & Budget), the user's plan ceiling (Plan & Entitlement), and the interrupt a person issues (Turn Interrupt).","purpose":"Makes unattended runs safe to start by bounding what they can consume.","functions":[["Set limits","Accepts limits from flags, settings, or a caller."],["Meter","Counts turns, tool calls, elapsed time, and estimated spend as the run proceeds."],["Stop at limit","Ends the run with a recorded reason when any limit is reached."]],"entities":[["Run Limit","The caps for one run. Attributes: max turns, max wall time, max tool calls, max spend, source."],["Run Meter","Current consumption. Attributes: turns, tool calls, elapsed seconds, spend to date."]],"inbound":[["Headless Run","CLI flag","limits for a non-interactive run"],["User Settings","config read","default limits"],["Usage Account","event record","spend to date"]],"outbound":[["Turn Execution","in-process call","the stop signal when a limit is reached"],["Transcript Log","event record","the limit-reached lifecycle event"]],"security":"A limit can be lowered by any caller and raised only by the user or an explicit flag.","storage":"In memory for the run; the outcome is in the transcript.","performance":"Metering adds no measurable latency; the stop is checked before each model call and tool call."}}]},{"id":"BA1.04","name":"Continuity","slug":"continuity","icon":"icons/cap-continuity.png","description":"Ability to resume, search, fork, summarize, and share sessions so work continues across restarts, days, and people.","scope":"Inside: the resume set, search, forks, progress checkpoints, and share links. Excludes delegation to child agents (Delegation), which is a different kind of fork.","owner":"Session runtime team","services":[{"id":"BA1.04.01","name":"Resume Set","slug":"resume-set","pattern":"Track","asset":"Session","prevalence":"mixed","evidence":"Cp open-sessions, sidebar pins · Cx read receipts · Gk active_sessions · Ag presence","description":"Which sessions are open or pinned, so they come back on restart.","platforms":["Cx","Cp","Ag","Gk"],"profile":{"inside":"The set of sessions that are open, pinned, or were active when the client last ran, so they are restored on the next start.","excludes":"The catalog of all sessions (Session Catalog) and the content being resumed (Transcript Log).","purpose":"Lets the user close the client and come back to the same work.","functions":[["Track open sessions","Records which sessions are open and whether a turn was in flight."],["Pin","Keeps a session in the sidebar or list for a workspace regardless of recency."],["Restore","Reopens the recorded sessions on start and rebuilds their context from the transcript."]],"entities":[["Open Session Entry","One open or pinned session. Attributes: session id, workspace, opened and refreshed timestamps, working flag, order."]],"inbound":[["Command Line","in-process call","sessions opened and closed in the terminal"],["IDE Attach","protocol message","sessions opened in the editor"],["Session Catalog","catalog query","identities to validate on restore"]],"outbound":[["Transcript Log","file read","the events to replay on restore"],["Command Line","in-process call","the sessions to show on start"]],"security":"Holds identifiers only.","storage":"A small state file per user, plus one per workspace for pinned order.","performance":"Restore of ten sessions completes within the client's start time."}},{"id":"BA1.04.02","name":"Session Search","slug":"session-search","pattern":"Analyze","asset":"Transcript","prevalence":"rare","evidence":"Cp FTS · Gk session_search","description":"Full-text search across past transcripts.","platforms":["Cp","Gk"],"profile":{"inside":"A full-text index over session titles and transcript content, with queries that return matching sessions and turns.","excludes":"Searching memory (Memory Retrieval) and searching the codebase (Code Search).","purpose":"Lets the user find a past conversation by what was said in it.","functions":[["Index","Adds new turns to the index as they are written."],["Query","Returns sessions and turns ranked by match."],["Rebuild","Recreates the index from transcripts when it is missing or stale."]],"entities":[["Search Document","One indexed unit. Attributes: session id, turn index, text, timestamp."],["Search Index","The full-text structure. Attributes: document count, last indexed sequence."]],"inbound":[["Transcript Log","file read","text to index"],["Session Catalog","catalog query","session metadata to attach to results"]],"outbound":[["Command Line","in-process call","search results to display"],["Agent Protocol Server","protocol message","search results for a client"]],"security":"Indexes user-private content; the index is as private as the transcripts and is deleted with them.","storage":"A full-text index in the platform home, rebuildable from transcripts.","performance":"A query over 100,000 turns returns in under 200 ms."}},{"id":"BA1.04.03","name":"Session Fork","slug":"session-fork","pattern":"Provision","asset":"Child Session","prevalence":"rare","evidence":"Cp fork_count · Cp workspace-fork lock","description":"Branching a conversation into a child session.","platforms":["Cp"],"profile":{"inside":"Creating a child session from a point in an existing one, so two lines of conversation can continue separately.","excludes":"Handing work to a child agent (Subagent Delegation), which is agent-initiated and scoped to a task.","purpose":"Lets the user explore an alternative without losing the original thread.","functions":[["Fork at turn","Copies the transcript up to a chosen turn into a new session."],["Link lineage","Records the parent session and fork point on the child."],["Lock during fork","Prevents two forks from racing on the same parent record."]],"entities":[["Fork Edge","The link between parent and child. Attributes: parent session id, child session id, fork turn index, timestamp."]],"inbound":[["Command Line","in-process call","the user forks the session"],["Agent Protocol Server","protocol message","a client forks a session"]],"outbound":[["Session Catalog","in-process call","the new child entry with lineage"],["Transcript Log","file write","the copied prefix of events"]],"security":"A fork inherits the parent's workspace trust and permissions; it does not widen them.","storage":"The child has its own transcript; lineage is on the catalog entry.","performance":"Forking a 10,000-event session completes under one second."}},{"id":"BA1.04.04","name":"Progress Checkpoint","slug":"progress-checkpoint","pattern":"Process","asset":"Checkpoint","prevalence":"rare","evidence":"Cp checkpoints: overview, work done, next steps","description":"A written summary of work done and next steps at a point in time.","platforms":["Cp"],"profile":{"inside":"A written summary at a point in time: what was done, what matters, which files, and what comes next.","excludes":"The raw transcript (Transcript Log), file snapshots (File Rewind), and automatic context shrinking (Context Compaction).","purpose":"Lets a person or a resumed session pick up the work without rereading everything.","functions":[["Write checkpoint","Produces the summary from the transcript at the current turn."],["List checkpoints","Returns the session's checkpoints in order."],["Load into context","Supplies the latest checkpoint to a resumed session."]],"entities":[["Checkpoint","One summary. Attributes: session id, turn index, title, overview, work done, technical details, important files, next steps, timestamp."]],"inbound":[["Transcript Log","file read","the turns to summarize"],["Turn Execution","in-process call","a checkpoint requested at the end of a turn"]],"outbound":[["Prompt Assembly","file read","the latest checkpoint for a resumed session"],["Command Line","in-process call","a readable checkpoint history"]],"security":"A checkpoint is derived content and inherits the transcript's privacy.","storage":"Markdown beside the session and a structured row in the catalog.","performance":"Writing a checkpoint costs one model call."}},{"id":"BA1.04.05","name":"Session Share Link","slug":"session-share-link","pattern":"Fulfill","asset":"Share Link","prevalence":"open","evidence":"no home stores a shareable link to a session","description":"A link that lets another person open a session.","platforms":[],"profile":{"inside":"A link that grants another person read or edit access to a session's record.","excludes":"Multi-user live collaboration (Shared Room) and exporting a file (Transcript Export).","purpose":"Lets a conversation be handed to a colleague without copying files.","functions":[["Create link","Generates a link with a scope (read or edit) and an optional expiry."],["Resolve link","Opens the session for the holder under the link's scope."],["Revoke","Invalidates a link."]],"entities":[["Share Link","One grant. Attributes: session id, token, scope, created and expiry timestamps, creator."]],"inbound":[["Command Line","in-process call","the user shares a session"]],"outbound":[["Web & Mobile Surface","HTTP request","the session rendered for the link holder"]],"security":"Links are bearer credentials: unguessable, expiring, and revocable; the transcript is redacted before it is shared.","storage":"Vendor-hosted, since the holder is not on the user's machine.","performance":"Open in under two seconds for a typical session."}}]},{"id":"BA1.05","name":"Recovery","slug":"recovery","icon":"icons/cap-recovery.png","description":"Ability to return a session and its files to a good state after a bad edit, an oversized context, or a need to archive or export, with nothing lost silently.","scope":"Inside: file rewind, context compaction, archive and erasure, and export. Excludes git-level undo (Change Set) and memory erasure (Pipeline).","owner":"Session runtime team","services":[{"id":"BA1.05.01","name":"File Rewind","slug":"file-rewind","pattern":"Maintain","asset":"File Snapshot","prevalence":"rare","evidence":"Cp rewind-file-snapshots · Cl file-history","description":"Restoring files to how they were before an agent edit.","platforms":["Cl","Cp"],"profile":{"inside":"Content-addressed snapshots of files before the agent edits them, and restoring any file or the whole set to a prior state.","excludes":"Git-level undo (Repository State, Worktree Isolation) and rewinding the conversation itself (Session Fork).","purpose":"Makes every agent edit reversible even when the workspace is not under version control.","functions":[["Snapshot before edit","Stores the prior bytes of a file the first time a turn changes it."],["Rewind","Restores one file or all files touched since a chosen turn."],["Prune","Discards snapshots when the session is archived."]],"entities":[["File Snapshot","Prior content of one file. Attributes: session id, turn index, path, content hash, size, timestamp."]],"inbound":[["File Edit","in-process call","the file about to change"],["Command Line","in-process call","the user asks to rewind"]],"outbound":[["File Edit","in-process call","the bytes to write back"],["Transcript Log","event record","the rewind event"]],"security":"Snapshots can contain source and data; they stay under the session's directory and are removed with it.","storage":"Content-addressed blobs per session, deduplicated by hash.","performance":"Snapshot cost is one copy per touched file per turn."}},{"id":"BA1.05.02","name":"Context Compaction","slug":"context-compaction","pattern":"Process","asset":"Context","prevalence":"mixed","evidence":"He compression · Cp compaction events, usage_checkpoint","description":"Shrinking the context window by summarizing older turns.","platforms":["Cp","He"],"profile":{"inside":"Reducing a session's context window by summarizing older turns and replacing them with the summary, with the originals kept in the transcript.","excludes":"Choosing what enters the window in the first place (Context Budget) and human-readable checkpoints (Progress Checkpoint).","purpose":"Lets long sessions continue past the model's context limit without losing the thread.","functions":[["Detect pressure","Watches token usage against the window size."],["Summarize and replace","Produces a summary of older turns and swaps it into the live context."],["Record","Logs the compaction with the range it covered."]],"entities":[["Compaction Record","One compaction. Attributes: session id, from and to turn index, summary tokens, replaced tokens, timestamp."]],"inbound":[["Usage Account","event record","token usage per call"],["Transcript Log","file read","the turns to summarize"]],"outbound":[["Prompt Assembly","in-process call","the compacted context for the next call"],["Transcript Log","event record","the compaction event"]],"security":"Summaries are model output and may paraphrase sensitive content; they stay with the session.","storage":"The summary lives in the live context and the event in the transcript.","performance":"One model call per compaction; triggered before the window overflows."}},{"id":"BA1.05.03","name":"Archive & Erasure","slug":"archive-and-erasure","pattern":"Administer","asset":"Session","prevalence":"rare","evidence":"Cp archives · Cp cleanup flags","description":"Archiving or deleting sessions and their traces.","platforms":["Cp"],"profile":{"inside":"Moving a session out of the active set and, on request, deleting it with its transcript, attachments, snapshots, and index entries.","excludes":"Forgetting memory (Memory Erasure) and vendor-side data deletion (Data Use Consent).","purpose":"Keeps the active list small and lets the user remove what should not persist.","functions":[["Archive","Marks a session archived and hides it from default lists."],["Erase","Deletes every local trace of a session and records the erasure."],["Clean up","Removes derived artifacts the platform no longer needs."]],"entities":[["Archive Record","One archived or erased session. Attributes: session id, action, timestamp, reason."]],"inbound":[["Command Line","in-process call","the user archives or deletes"],["Session Catalog","catalog query","the session and its related stores"]],"outbound":[["Transcript Log","file delete","the log to remove"],["Attachment Store","file delete","attachments to remove"],["File Rewind","file delete","snapshots to remove"],["Session Search","index update","entries to drop"]],"security":"Erasure is complete on the local machine; anything already exported or shared is out of scope and is said so.","storage":"Archived sessions stay in place; erased sessions leave only the archive record.","performance":"Erasure of a session completes within seconds regardless of size."}},{"id":"BA1.05.04","name":"Transcript Export","slug":"transcript-export","pattern":"Fulfill","asset":"Export","prevalence":"open","evidence":"no export store in any home","description":"Writing a session out in a portable format.","platforms":[],"profile":{"inside":"Writing a session out as a portable file: markdown, JSON, or HTML, with attachments optionally bundled.","excludes":"Auditor-ready records (Audit Export) and links to the live session (Session Share Link).","purpose":"Lets a conversation leave the platform for documentation, review, or another tool.","functions":[["Export","Produces the file in the chosen format from the transcript."],["Redact","Applies secret redaction and optional path anonymization before writing."],["Bundle","Includes attachments and checkpoints when asked."]],"entities":[["Export","One exported file. Attributes: session id, format, path, redaction applied, timestamp."]],"inbound":[["Transcript Log","file read","the events to export"],["Attachment Store","file read","attachments to bundle"],["Command Line","in-process call","the user requests an export"]],"outbound":[["User","file write","the exported file"]],"security":"Redaction is on by default; exporting without it requires an explicit flag.","storage":"Written where the user asks; the platform keeps no copy.","performance":"Export of a 10,000-event session completes under five seconds."}}]}]},{"id":"BA2","name":"Authority & Configuration","hue":2,"slug":"authority-and-configuration","icon":"icons/area-authority-and-configuration.png","description":"Ability to bound what the agent may do, as which identity, under which policy, and to configure that at user, project, and organization scope, with every grant recorded.","scope":"Covers admission, identity, execution control, and configuration. Excludes the tools themselves (Extension & Tools) and the model provider's own limits (Models).","capabilities":[{"id":"BA2.01","name":"Admission","slug":"admission","icon":"icons/cap-admission.png","description":"Ability to decide which workspaces, content, and policies the agent may act under before any tool runs, with trust decisions recorded and organization policy enforced over user settings.","scope":"Inside: workspace trust, managed policy, content exclusion, and the untrusted-content guard. Excludes per-action approval (Execution Control) and who the agent is (Identity).","owner":"Trust and policy team","services":[{"id":"BA2.01.01","name":"Workspace Trust","slug":"workspace-trust","pattern":"Agree","asset":"Folder","prevalence":"mixed","evidence":"Cx trust_level · Cp trustedFolders · Ge · Ag · Gk decided_at","description":"A recorded decision that the agent may act in a folder.","platforms":["Cx","Cp","Ge","Ag","Gk"],"profile":{"inside":"The recorded decision that the agent may act inside a folder, the prompt that asks for it, and the list of trusted folders.","excludes":"Per-action approvals (Approval Mode, Remembered Grant) and exclusion of files within a trusted folder (Content Exclusion).","purpose":"Stops the agent from acting in a directory the user has not deliberately opened to it.","functions":[["Prompt for trust","Asks the user the first time a folder is opened and records the answer with a timestamp."],["Check trust","Answers whether a path is inside a trusted folder before any tool runs."],["Revoke","Removes a folder from the trusted list."]],"entities":[["Trust Decision","One folder's status. Attributes: path, level (trusted, untrusted), decided timestamp, decided by."]],"inbound":[["Workspace Binding","in-process call","the folder a session is bound to"],["Command Line","in-process call","the user's answer to the trust prompt"],["Managed Policy","config read","organization rules that force or forbid trust"]],"outbound":[["Tool Call Dispatch","in-process call","whether the workspace permits tools at all"],["Permission Stream","event record","the trust decision"]],"security":"Trust is per folder and per user; a parent folder's trust covers its children unless policy says otherwise.","storage":"A list in the user settings or a dedicated trust file in the platform home.","performance":"A path check is an in-memory prefix match."}},{"id":"BA2.01.02","name":"Managed Policy","slug":"managed-policy","pattern":"Administer","asset":"Policy","prevalence":"rare","evidence":"Cp managed settings: MDM, account policy · Cl dangerous-mode flag","description":"Organization or device policy that overrides user settings.","platforms":["Cl","Cp"],"profile":{"inside":"Settings imposed by an organization or device manager that override the user's own, including whether approval bypass is allowed.","excludes":"The user's own settings (User Settings) and the plan that governs consumption (Plan & Entitlement).","purpose":"Lets an organization set a floor on safety that individual users cannot lower.","functions":[["Load policy","Reads device management and account policy at start and on refresh."],["Enforce precedence","Applies policy over user and project settings wherever they overlap."],["Report effective policy","Shows the user which settings are locked and by whom."]],"entities":[["Policy","One policy document. Attributes: source (device, account), version, settings, fetched timestamp."],["Locked Setting","One setting policy controls. Attributes: key, value, source."]],"inbound":[["Organization admin","HTTP request","account policy from the vendor"],["Operating system","config read","device management profile"]],"outbound":[["Approval Mode","config read","whether bypass is permitted"],["Workspace Trust","config read","forced or forbidden folders"],["User Settings","config read","keys that are locked"],["Data Use Consent","config read","consent set at organization level"]],"security":"Policy is signed or fetched over an authenticated channel; a missing policy means no restriction, and the platform says so.","storage":"Cached in the platform home and refreshed on start.","performance":"Policy fetch does not block start; the cached copy applies until refreshed."}},{"id":"BA2.01.03","name":"Content Exclusion","slug":"content-exclusion","pattern":"Administer","asset":"Exclusion Rule","prevalence":"mixed","evidence":"Ge .geminiignore · Cp content exclusions · Cl deny-read rules","description":"Rules that keep named files or paths out of the agent's reach.","platforms":["Cl","Cp","Ge"],"profile":{"inside":"Rules that keep named files, paths, or patterns out of the agent's reads, writes, and context, at user, project, and organization scope.","excludes":"Trust in the folder as a whole (Workspace Trust) and redaction of secrets found in content (Secret Redaction).","purpose":"Keeps secrets, generated bulk, and sensitive files from ever reaching the model.","functions":[["Load rules","Reads ignore files and deny-read settings from each scope."],["Match path","Decides whether a path is excluded before a tool touches it."],["Explain","Tells the user which rule blocked a path."]],"entities":[["Exclusion Rule","One pattern. Attributes: scope, pattern, action (deny read, deny write, deny both), source file."]],"inbound":[["Project Settings","config read","project-scoped ignore files"],["User Settings","config read","user deny rules"],["Managed Policy","config read","organization exclusions"]],"outbound":[["File Edit","in-process call","the verdict for a path"],["Code Search","in-process call","paths to skip"],["Prompt Assembly","in-process call","files that may not be attached"],["Codebase Index","in-process call","paths to leave out of the index"]],"security":"A deny rule cannot be overridden by a lower scope; a missing rule set means nothing is excluded.","storage":"Ignore files in the repository and settings in the platform home.","performance":"Path matching is in memory and under a millisecond."}},{"id":"BA2.01.04","name":"Untrusted Content Guard","slug":"untrusted-content-guard","pattern":"Assess","asset":"Content","prevalence":"open","evidence":"no home marks pasted or fetched content","description":"Marking pasted, fetched, or downloaded content so it is treated as data, not instructions.","platforms":[],"profile":{"inside":"Marking content that did not come from the user, such as pasted text, fetched pages, downloaded files, and tool output, so the model treats it as data and not as instructions.","excludes":"Filtering harmful output (Content Safety) and excluding files by path (Content Exclusion).","purpose":"Reduces prompt injection by keeping the provenance of every piece of context visible to the model.","functions":[["Tag provenance","Wraps or labels content with its origin before it enters the prompt."],["Isolate downloads","Places fetched files in their own directory and keeps scripts from running against them."],["Flag instructions","Warns when untrusted content contains imperative text aimed at the agent."]],"entities":[["Provenance Tag","One label. Attributes: content id, origin (user, paste, web, file, tool), trust level."]],"inbound":[["Web Retrieval","in-process call","fetched pages"],["Multimodal Input","in-process call","pasted content"],["Tool Call Dispatch","in-process call","tool output"]],"outbound":[["Prompt Assembly","in-process call","content with provenance labels"],["Transcript Log","event record","flagged injection attempts"]],"security":"Labels are added by the platform, never by the content itself; a label cannot be forged from inside the content.","storage":"None; labels live with the content in the live context and the transcript.","performance":"Labeling is linear in content size and adds no model calls."}}]},{"id":"BA2.02","name":"Identity","slug":"identity","icon":"icons/cap-identity.png","description":"Ability to establish who the agent acts as, with which credentials, and under what consent, keeping the agent's identity separable from the user's.","scope":"Inside: account sign-in, data-use consent, and an agent credential of its own. Excludes model provider keys (Model Supply) and secrets handed to tools (Execution Control).","owner":"Identity and accounts team","services":[{"id":"BA2.02.01","name":"Account & Credential","slug":"account-and-credential","pattern":"Register","asset":"Account","prevalence":"wide","evidence":"vendor login on Cx Cl Cp Ge Gk · He Qw endpoint keys","description":"Signing in to the vendor or holding the key for an endpoint.","platforms":["Cx","Cl","Cp","Ge","Gk","He","Qw"],"profile":{"inside":"Signing in to the vendor or holding the key for a provider e       '<span class="gv-hubs">most depended on: '+TOP_IN.map(function(n){return '<a href="#graph-'+n.slug+'">'+esc(n.name)+' <small>'+n.inDeg+'</small></a>';}).join('')+'</span></div>';

    if(act!=null){nb[act]=1;NODES[act].ins.forEach(function(e){nb[e.a.i]=1;});NODES[act].outs.forEach(function(e){nb[e.b.i]=1;});}
    var mxN={};
    var lines=document.getElementById('gv-edges').children;
    EDGES.forEach(function(e){
      var el=lines[e.i], vis=visible(e.a)&&visible(e.b), mx=S.mech&&e.mechs.indexOf(S.mech)>=0, hl=act!=null&&(e.a.i===act||e.b.i===act);
      el.setAttribute('class',(vis?'':'gv-off ')+(hl?'gv-hl ':'')+(mx?'gv-mx ':'')+((act!=null&&!hl)||(S.mech&&!mx)?'gv-dim':''));
      el.setAttribute('marker-end','url(#'+(hl?'gv-arr-hl':mx?'gv-arr-mx':'gv-arr')+')');
      if(mx&&vis){mxN[e.a.i]=1;mxN[e.b.i]=1;}
    });
    var gs=document.getElementById('gv-nodes').children, ls=document.getElementById('gv-labels').children;
    NODES.forEach(function(n){
      var vis=visible(n), dim=(act!=null&&!nb[n.i])||(S.mech&&!mxN[n.i]&&!(act!=null&&nb[n.i]));
      var c=(vis?'':' gv-off')+(dim?' gv-dim':'')+(n.i===act?' gv-act':'')+(act!=null&&nb[n.i]&&n.i!==act?' gv-nb':'')+(n.i===S.sel?' gv-sel':'');
      gs[n.i].setAttribute('class',baseCls(n)+c);
      var lc='gv-l'+(n.hub||n.kind==='actor'?' gv-always':'')+(n.hub?' gv-lhub':'')+(vis?'':' gv-off')+(dim?' gv-dim':'')+(act!=null&&nb[n.i]?' gv-show':'')+(n.i===act?' gv-lact':'');
      ls[n.i].setAttribute('class',lc);
      if(n.kind==='service'&&!vis&&n.i===S.sel)S.sel=null;
    });
    svgEl.classList.toggle('gv-has-act',act!=null);
    panel();
  }

  // ---------- pan and zoom ----------
  function setT(){
    var g=document.getElementById('gv-view');if(!g)return;
    g.setAttribute('transform','translate('+f1(S.tx)+' '+f1(S.ty)+') scale('+Math.round(S.k*1000)/1000+')');
    var s=document.getElementById('gv-svg');
    s.classList.toggle('gv-zoomed',S.k>=LABEL_ZOOM);
    document.getElementById('gv-edges').setAttribute('stroke-width',f1(1/Math.pow(S.k,.7)*10)/10);
    document.getElementById('gv-labels').setAttribute('font-size',f1(15/Math.pow(S.k,.8)));
  }
  function zoomAt(f,px,py){
    var k=Math.max(.6,Math.min(8,S.k*f));f=k/S.k;
    S.tx=px-(px-S.tx)*f;S.ty=py-(py-S.ty)*f;S.k=k;setT();
  }
  function toSvg(svgEl,cx,cy){var m=svgEl.getScreenCTM();if(!m)return {x:W/2,y:H/2};var p=svgEl.createSVGPoint();p.x=cx;p.y=cy;p=p.matrixTransform(m.inverse());return {x:p.x,y:p.y};}
  function center(n,k){S.k=k||Math.max(S.k,2.2);S.tx=W/2-n.x*S.k;S.ty=H/2-n.y*S.k;setT();}
  function reset(){S.k=1;S.tx=0;S.ty=0;setT();}

  function select(i){S.sel=i;S.hover=null;apply();}

  function wire(m){
    var svgEl=document.getElementById('gv-svg'), stage=document.getElementById('gv-stage');
    var hash=location.hash;
    if(S.route!==hash){S.route=hash;S.k=1;S.tx=0;S.ty=0;S.hover=null;S.sel=null;
      if(m&&m[1]&&bySlug[m[1]]){var n=bySlug[m[1]];if(n.kind==='actor')S.actors=true;else{delete S.areasOff[n.area];if(n.prevalence==='open')S.open=true;}S.sel=n.i;center(n,2.4);}}
    setT();apply();
    // filters
    document.querySelectorAll('#gv-filters [data-area]').forEach(function(b){b.addEventListener('click',function(){var id=b.getAttribute('data-area');if(S.areasOff[id])delete S.areasOff[id];else S.areasOff[id]=1;b.setAttribute('aria-pressed',String(!S.areasOff[id]));apply();});});
    var ba=document.getElementById('gv-actors'),bo=document.getElementById('gv-open'),ms=document.getElementById('gv-mech');
    ba.addEventListener('click',function(){S.actors=!S.actors;ba.setAttribute('aria-pressed',String(S.actors));if(!S.actors&&S.sel!=null&&NODES[S.sel].kind==='actor')S.sel=null;apply();});
    bo.addEventListener('click',function(){S.open=!S.open;bo.setAttribute('aria-pressed',String(S.open));apply();});
    ms.addEventListener('change',function(){S.mech=ms.value;apply();});
    // zoom buttons
    document.getElementById('gv-zin').addEventListener('click',function(){zoomAt(1.4,W/2,H/2);});
    document.getElementById('gv-zout').addEventListener('click',function(){zoomAt(1/1.4,W/2,H/2);});
    document.getElementById('gv-reset').addEventListener('click',reset);
    svgEl.addEventListener('wheel',function(e){e.preventDefault();var p=toSvg(svgEl,e.clientX,e.clientY);zoomAt(Math.pow(1.0018,-e.deltaY*(e.deltaMode===1?16:1)),p.x,p.y);},{passive:false});
    // pointer: drag pans, a tap without movement selects or clears; two pointers pinch
    var pts={}, drag=null, pinch=null;
    svgEl.addEventListener('pointerdown',function(e){
      if(e.button!==undefined&&e.button>0)return;
      pts[e.pointerId]={x:e.clientX,y:e.clientY};
      var ids=Object.keys(pts);
      if(ids.length===2){var a=pts[ids[0]],b=pts[ids[1]];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,k:S.k};drag=null;return;}
      var g=e.target.closest('[data-n]');
      drag={x:e.clientX,y:e.clientY,tx:S.tx,ty:S.ty,moved:false,node:g?+g.getAttribute('data-n'):null,id:e.pointerId};
    });
    svgEl.addEventListener('pointermove',function(e){
      if(pts[e.pointerId])pts[e.pointerId]={x:e.clientX,y:e.clientY};
      if(pinch){var ids=Object.keys(pts);if(ids.length<2)return;var a=pts[ids[0]],b=pts[ids[1]];var mid=toSvg(svgEl,(a.x+b.x)/2,(a.y+b.y)/2);zoomAt(pinch.k*(Math.hypot(a.x-b.x,a.y-b.y)/pinch.d)/S.k,mid.x,mid.y);return;}
      if(!drag||drag.id!==e.pointerId)return;
      var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
      if(!drag.moved&&Math.abs(dx)+Math.abs(dy)>4){drag.moved=true;stage.classList.add('gv-dragging');try{svgEl.setPointerCapture(e.pointerId);}catch(_){}}
      if(drag.moved){var m=svgEl.getScreenCTM(),sc=m?m.a:1;S.tx=drag.tx+dx/sc;S.ty=drag.ty+dy/sc;setT();}
    });
    function up(e){
      delete pts[e.pointerId];
      if(pinch){if(Object.keys(pts).length<2)pinch=null;drag=null;return;}
      if(!drag||drag.id!==e.pointerId)return;
      if(!drag.moved&&e.type==='pointerup'){if(drag.node!=null)select(drag.node);else if(S.sel!=null)select(null);}
      drag=null;stage.classList.remove('gv-dragging');
    }
    svgEl.addEventListener('pointerup',up);svgEl.addEventListener('pointercancel',up);
    // hover
    svgEl.addEventListener('pointerover',function(e){if(drag&&drag.moved)return;if(e.pointerType==='touch')return;var g=e.target.closest('[data-n]');if(g){S.hover=+g.getAttribute('data-n');apply();}});
    svgEl.addEventListener('pointerout',function(e){var g=e.target.closest('[data-n]');if(g&&S.hover!=null&&!(e.relatedTarget&&g.contains(e.relatedTarget))){S.hover=null;apply();}});
    // keyboard
    svgEl.addEventListener('keydown',function(e){
      var g=e.target.closest('[data-n]');
      if(e.key==='Escape'){select(null);return;}
      if(!g)return;
      if(e.key==='Enter'||e.key===' '){e.preventDefault();var i=+g.getAttribute('data-n');select(S.sel===i?null:i);}
    });
    svgEl.addEventListener('focusin',function(e){var g=e.target.closest('[data-n]');if(g){S.hover=+g.getAttribute('data-n');apply();}});
    svgEl.addEventListener('focusout',function(){if(S.hover!=null){S.hover=null;apply();}});
    // panel: select-in-graph buttons and clear
    document.getElementById('gv-panel').addEventListener('click',function(e){
      var b=e.target.closest('[data-go]');
      if(b){var i=+b.getAttribute('data-go'),n=NODES[i];if(!visible(n)){if(n.kind==='actor'){S.actors=true;ba.setAttribute('aria-pressed','true');}else{delete S.areasOff[n.area];var c=document.getElementById('gv-area-'+n.area);if(c)c.setAttribute('aria-pressed','true');if(n.prevalence==='open'){S.open=true;bo.setAttribute('aria-pressed','true');}}}select(i);if(S.k>1.2)center(n,S.k);return;}
      if(e.target.id==='gv-clear')select(null);
    });
  }

  CM.addRoute(/^graph$/,function(){return view(null);},'graph',function(m){wire(m);});
  CM.addRoute(/^graph-(.+)$/,function(m){return view(bySlug[m[1]]||null);},'graph',function(m){wire(m);});
  CM.addNav('Graph','#graph','graph');
})();

/* views/score.js */
// Score your platform: a self-assessment of any agent platform against the 127 services.
// Route #score. State lives in localStorage under 'cm-score'; sharing is by copied Markdown or JSON.
(function(){
  var esc=CM.esc, AREAS=CM.AREAS, SERVICES=CM.SERVICES, PLATFORMS=CM.PLATFORMS;
  var KEY='cm-score';
  var STATES=['absent','shipped','configured','observed'];
  var LABEL={absent:'Absent',shipped:'Shipped',configured:'Configured',observed:'Observed'};
  var HINT={
    absent:'Nothing on this platform delivers the service.',
    shipped:'The schema, binary, or bundled skill exists.',
    configured:'The setting or plugin is turned on.',
    observed:'Real sessions, approvals, jobs, or memories exist.'
  };
  var byId={};SERVICES.forEach(function(s){byId[s.id]=s;});

  // ---------- state ----------
  var S=null;
  function blank(){return {name:'',compare:'none',states:{}};}
  function clean(o){
    var out=blank();
    if(!o||typeof o!=='object')return out;
    if(typeof o.name==='string')out.name=o.name.slice(0,120);
    if(typeof o.compare==='string'&&(o.compare==='none'||CM.byPlat[o.compare]))out.compare=o.compare;
    var st=o.states&&typeof o.states==='object'?o.states:{};
    Object.keys(st).forEach(function(k){
      var s=byId[k]||CM.bySvc[k], v=st[k];
      if(typeof v==='number')v=STATES[v];
      if(s&&STATES.indexOf(v)>0)out.states[s.id]=v;
    });
    return out;
  }
  function load(){
    if(S)return S;
    var raw=null;
    try{raw=localStorage.getItem(KEY);}catch(e){raw=null;}
    try{S=clean(raw?JSON.parse(raw):null);}catch(e){S=blank();}
    return S;
  }
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify({v:1,model:CM.DATA.version,name:S.name,compare:S.compare,states:S.states}));}catch(e){}
  }
  function stateOf(s){return S.states[s.id]||'absent';}
  function setState(s,v){if(v==='absent')delete S.states[s.id];else S.states[s.id]=v;}

  // ---------- numbers ----------
  function areaServices(a){var l=[];a.capabilities.forEach(function(c){l=l.concat(c.services);});return l;}
  function tally(){
    var t={counts:{absent:0,shipped:0,configured:0,observed:0},scored:0,scoredEvid:0,areas:[]};
    SERVICES.forEach(function(s){var v=stateOf(s);t.counts[v]++;if(v!=='absent'){t.scored++;if(s.prevalence!=='open')t.scoredEvid++;}});
    var cmp=S.compare!=='none'?CM.byPlat[S.compare]:null;
    AREAS.forEach(function(a){
      var list=areaServices(a), r={a:a,n:list.length,shipped:0,configured:0,observed:0,k:0,c:0};
      list.forEach(function(s){var v=stateOf(s);if(v!=='absent'){r[v]++;r.k++;}if(cmp&&CM.covers(s,cmp.code))r.c++;});
      t.areas.push(r);
    });
    t.cmp=cmp;
    if(cmp){
      t.mine=SERVICES.filter(function(s){return stateOf(s)!=='absent'&&!CM.covers(s,cmp.code);});
      t.theirs=SERVICES.filter(function(s){return stateOf(s)==='absent'&&CM.covers(s,cmp.code);});
      t.cmpN=CM.countFor(cmp.code);
    }
    var ranks=PLATFORMS.map(function(p){return {p:p,n:CM.countFor(p.code)};}).sort(function(x,y){return y.n-x.n;});
    t.above=ranks.filter(function(r){return r.n>t.scored;});
    t.ties=ranks.filter(function(r){return r.n===t.scored;});
    t.rank=t.above.length+1;
    t.ranks=ranks;
    return t;
  }
  function pct(n,d){return d?Math.round(100*n/d):0;}
  function ord(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
  function displayName(){return S.name.trim()||'Your platform';}

  // ---------- summary card ----------
  function summary(){
    var t=tally(), cmp=t.cmp, name=displayName();
    var stats='<div class="stats scstats">'+
      '<div class="stat"><div class="n">'+t.scored+'</div><div class="k">services above Absent</div><div class="src">of '+CM.TOTAL+' in the model</div></div>'+
      '<div class="stat"><div class="n">'+pct(t.scoredEvid,CM.EVID)+'%</div><div class="k">of the evidenced landscape</div><div class="src">'+t.scoredEvid+' of '+CM.EVID+' evidenced services</div></div>'+
      '<div class="stat"><div class="n">'+ord(t.rank)+'</div><div class="k">rank among the nine by count</div><div class="src">'+rankNote(t)+'</div></div></div>';
    var states='<div class="scstates">'+STATES.slice().reverse().map(function(k){return '<span class="scst"><span class="sw '+k+'"></span>'+LABEL[k]+' <b>'+t.counts[k]+'</b></span>';}).join('')+'</div>';
    var bars='<div class="bars">'+t.areas.map(function(r){
      var w=function(x){return (r.n?100*x/r.n:0).toFixed(2)+'%';};
      var left=0, segs=['observed','configured','shipped'].map(function(k){var h='<span class="bf sc-'+k+'" style="left:'+w(left)+';width:'+w(r[k])+'"></span>';left+=r[k];return h;}).join('');
      var mark=cmp?'<span class="scmark" style="left:'+w(r.c)+'"></span>':'';
      var d=r.k-r.c, delta=cmp?'<span class="scd '+(d>0?'up':d<0?'dn':'eq')+'">'+(d>0?'+':'')+d+'</span>':'';
      var tip='<b>'+esc(r.a.name)+'</b><br>'+r.k+' of '+r.n+' services above Absent<br>Observed '+r.observed+' · Configured '+r.configured+' · Shipped '+r.shipped+(cmp?'<br>'+esc(cmp.name)+': '+r.c:'');
      return '<div class="brow scbrow" data-tip="'+esc(tip)+'"><span class="bl"><span class="scdot" style="background:'+CM.hue(r.a)+'"></span>'+esc(r.a.name)+'</span><span class="bt">'+segs+mark+'</span><span class="bv">'+r.k+' / '+r.n+delta+'</span></div>';
    }).join('')+'</div>';
    var key='<div class="legend sclegend"><span><span class="sw sc-observed"></span>Observed</span><span><span class="sw sc-configured"></span>Configured</span><span><span class="sw sc-shipped"></span>Shipped</span>'+(cmp?'<span><span class="sw scmk"></span>'+esc(cmp.name)+' evidences</span><span class="mono">delta = yours minus '+esc(cmp.code)+'</span>':'')+'</div>';
    var lists='';
    if(cmp){
      lists='<div class="lists sclists"><div><p class="lab">'+esc(name)+' has, '+esc(cmp.name)+' lacks · '+t.mine.length+'</p>'+svcList(t.mine,'Nothing scored here is missing from '+esc(cmp.name)+'.')+'</div>'+
        '<div><p class="lab">'+esc(cmp.name)+' has, '+esc(name)+' lacks · '+t.theirs.length+'</p>'+svcList(t.theirs,'Every service '+esc(cmp.name)+' evidences is scored here.')+'</div></div>';
    }
    return '<div class="eyebrow">Coverage card'+(cmp?' · compared to '+esc(cmp.name):'')+'</div>'+
      '<h2 class="scname">'+esc(name)+'</h2>'+
      '<div class="scgrid"><div>'+stats+states+'</div><div><p class="lab">By area'+(cmp?' · delta vs '+esc(cmp.code):'')+'</p>'+bars+key+'</div></div>'+lists;
  }
  function rankNote(t){
    var parts=[];
    if(t.above.length)parts.push('behind '+t.above.map(function(r){return r.p.code;}).join(', '));
    if(t.ties.length)parts.push('tied with '+t.ties.map(function(r){return r.p.code;}).join(', '));
    if(!t.above.length&&!t.ties.length)parts.push('ahead of all nine');
    return parts.join('; ');
  }
  function svcList(list,empty){
    if(!list.length)return '<p class="empty" style="padding:8px 0">'+empty+'</p>';
    return '<ul>'+list.map(function(s){return '<li><a href="#svc-'+s.slug+'">'+esc(s.name)+'</a> <span class="h">'+esc(s.area.name)+'</span></li>';}).join('')+'</ul>';
  }

  // ---------- checklist ----------
  function seg(s){
    var v=stateOf(s), nm='sc-'+s.slug;
    return '<div class="scseg" id="'+nm+'" role="radiogroup" aria-label="'+esc(s.name)+' state">'+STATES.map(function(k,i){
      var id=nm+'-'+k;
      return '<input type="radio" name="'+nm+'" id="'+id+'" value="'+k+'" data-svc="'+s.id+'"'+(v===k?' checked':'')+'><label for="'+id+'" title="'+esc(HINT[k])+'">'+LABEL[k]+'</label>';
    }).join('')+'</div>';
  }
  function item(s){
    var v=stateOf(s);
    return '<div class="tile sctile'+(v!=='absent'?' on':'')+(s.prevalence==='open'?' open':'')+'" id="sct-'+s.slug+'" style="border-left-color:'+CM.hue(s.area)+'">'+
      '<div class="tn"><a href="#svc-'+s.slug+'">'+esc(s.name)+'</a> <span class="scid">'+s.id+'</span></div>'+
      '<div class="tm"><b>'+esc(s.pattern)+'</b> · '+esc(s.asset)+(s.prevalence==='open'?' · open':'')+'</div>'+
      '<div class="td">'+esc(s.description)+'</div>'+seg(s)+'</div>';
  }
  function areaBlock(a){
    return '<section class="asec" id="sca-'+a.id+'">'+CM.areaHead(a,true)+
      '<div class="scbulk"><label for="scb-'+a.id+'">Mark every service in '+esc(a.name)+' as</label><select id="scb-'+a.id+'">'+STATES.map(function(k){return '<option value="'+k+'">'+LABEL[k]+'</option>';}).join('')+'</select><button type="button" class="scbtn" data-bulk="'+a.id+'">Apply</button><span class="scmsg" id="scbm-'+a.id+'" role="status"></span></div>'+
      a.capabilities.map(function(c){
        return '<div class="csec"><div class="chead"><h3>'+CM.ico(c,'xs')+'<a href="#cap-'+c.key+'">'+esc(c.name)+'</a></h3><p>'+esc(c.description)+'</p></div><div class="tiles sctiles">'+c.services.map(item).join('')+'</div></div>';
      }).join('')+'</section>';
  }

  // ---------- sharing ----------
  function toJSON(){
    var st={};SERVICES.forEach(function(s){var v=stateOf(s);if(v!=='absent')st[s.id]=v;});
    return JSON.stringify({kind:'cm-score',schema:1,model:CM.DATA.name,version:CM.DATA.version,platform:S.name,compare:S.compare,states:st},null,2);
  }
  function toMarkdown(){
    var t=tally(), cmp=t.cmp, L=[];
    L.push('# '+displayName()+': AI Platform Capability Model '+CM.DATA.version+' self-assessment');
    L.push('');
    L.push('- Services above Absent: **'+t.scored+' of '+CM.TOTAL+'**');
    L.push('- Evidenced landscape: **'+pct(t.scoredEvid,CM.EVID)+'%** ('+t.scoredEvid+' of '+CM.EVID+')');
    L.push('- States: Observed '+t.counts.observed+', Configured '+t.counts.configured+', Shipped '+t.counts.shipped+', Absent '+t.counts.absent);
    L.push('- Rank among the nine by count: '+ord(t.rank)+' ('+rankNote(t)+')');
    if(cmp)L.push('- Compared to: '+cmp.name+' ('+t.cmpN+' services evidenced)');
    L.push('');
    L.push('| Area | Scored | Observed | Configured | Shipped |'+(cmp?' '+cmp.code+' | Delta |':''));
    L.push('|---|---:|---:|---:|---:|'+(cmp?'---:|---:|':''));
    t.areas.forEach(function(r){var d=r.k-r.c;L.push('| '+r.a.name+' | '+r.k+' / '+r.n+' | '+r.observed+' | '+r.configured+' | '+r.shipped+' |'+(cmp?' '+r.c+' | '+(d>0?'+':'')+d+' |':''));});
    if(cmp){
      L.push('');
      L.push('**'+displayName()+' has, '+cmp.name+' lacks ('+t.mine.length+'):** '+(t.mine.map(function(s){return s.name;}).join(', ')||'none'));
      L.push('');
      L.push('**'+cmp.name+' has, '+displayName()+' lacks ('+t.theirs.length+'):** '+(t.theirs.map(function(s){return s.name;}).join(', ')||'none'));

  function copy(text,msgEl,label){
    var out=document.getElementById('scOutWrap'), ta=document.getElementById('scOut');

      ta.value=text;out.hidden=false;ta.focus();ta.select();

    }
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){out.hidden=true;msgEl.textContent=label.charAt(0).toUpperCase()+label.slice(1)+' copied to the clipboard.';},fallback);
      }else fallback();
    }catch(e){fallback();}
  }

  // ---------- view ----------
  function view(){

      '<label class="scfield"><span>Compare to</span><select id="scCmp"><option value="none">none</option>'+PLATFORMS.map(function(p){return '<option value="'+p.code+'"'+(S.compare===p.code?' selected':'')+'>'+esc(p.name)+' ('+p.code+')</option>';}).join('')+'</select></label></div>';
    return CM.header('Score your platform.','Mark each of the '+CM.TOTAL+' services as <b>Absent</b>, <b>Shipped</b> (the schema, binary, or bundled skill exists), <b>Configured</b> (the setting or plugin is on), or <b>Observed</b> (real sessions, approvals, jobs, or memories exist). The card updates as you go and is saved in this browser.',right)+
      '<div id="scRoot">'+
      '<div class="panel sccard" id="scCard" aria-live="polite">'+summary()+'</div>'+
      '<div class="scactions"><button type="button" class="scbtn" id="scCopyMd">Copy card as Markdown</button><button type="button" class="scbtn" id="scCopyJson">Copy as JSON</button><button type="button" class="scbtn" id="scImpBtn" aria-expanded="false" aria-controls="scImp">Import JSON</button>'+
      '<span class="screset"><button type="button" class="scbtn warn" id="scReset">Reset</button><span id="scResetAsk" hidden><span class="scq">Clear the name, comparison, and all '+CM.TOTAL+' scores?</span><button type="button" class="scbtn warn" id="scResetYes">Yes, reset</button><button type="button" class="scbtn" id="scResetNo">Cancel</button></span></span>'+
      '<span class="scmsg" id="scMsg" role="status"></span></div>'+
      '<div class="panel scbox" id="scOutWrap" hidden><p class="lab">Copy this text</p><textarea id="scOut" rows="10" readonly aria-label="Text to copy"></textarea></div>'+
      '<div class="panel scbox" id="scImp" hidden><p class="lab">Paste a card copied as JSON</p><textarea id="scImpText" rows="8" aria-label="JSON to import" placeholder="{&quot;kind&quot;:&quot;cm-score&quot;, ...}"></textarea><div class="scactions"><button type="button" class="scbtn" id="scImpGo">Import and replace</button><button type="button" class="scbtn" id="scImpCancel">Cancel</button><span class="scmsg" id="scImpMsg" role="status"></span></div></div>'+
      '<div class="legend sckey">'+STATES.map(function(k){return '<span><b>'+LABEL[k]+'</b> '+esc(HINT[k])+'</span>';}).join('')+'</div>'+
      '<div id="scList">'+AREAS.map(areaBlock).join('')+'</div></div>'+CM.foot();
  }

  function after(){
    load();
    var card=document.getElementById('scCard'), list=document.getElementById('scList');
    if(!card||!list)return;
    var msg=document.getElementById('scMsg');
    function refresh(){card.innerHTML=summary();}
    function syncTile(s){
      var t=document.getElementById('sct-'+s.slug);if(!t)return;
      var v=stateOf(s);t.classList.toggle('on',v!=='absent');
      var r=document.getElementById('sc-'+s.slug+'-'+v);if(r)r.checked=true;
    }
    list.addEventListener('change',function(e){
      var el=e.target;if(!el||el.type!=='radio'||!el.getAttribute('data-svc'))return;
      var s=byId[el.getAttribute('data-svc')];if(!s)return;
      setState(s,el.value);syncTile(s);save();refresh();
    });
    list.addEventListener('click',function(e){
      var b=e.target.closest&&e.target.closest('[data-bulk]');if(!b)return;
      var a=CM.byArea[b.getAttribute('data-bulk')], sel=document.getElementById('scb-'+a.id), v=sel.value, l=areaServices(a);
      l.forEach(function(s){setState(s,v);syncTile(s);});save();refresh();
      document.getElementById('scbm-'+a.id).textContent=l.length+' services set to '+LABEL[v]+'.';
    });
    var nm=document.getElementById('scName');
    nm.addEventListener('input',function(){S.name=nm.value.slice(0,120);save();refresh();});
    var cs=document.getElementById('scCmp');
    cs.addEventListener('change',function(){S.compare=cs.value;save();refresh();});
    document.getElementById('scCopyMd').addEventListener('click',function(){copy(toMarkdown(),msg,'Markdown card');});
    document.getElementById('scCopyJson').addEventListener('click',function(){copy(toJSON(),msg,'JSON');});
    var imp=document.getElementById('scImp'), impBtn=document.getElementById('scImpBtn'), impTxt=document.getElementById('scImpText'), impMsg=document.getElementById('scImpMsg');
    function showImp(on){imp.hidden=!on;impBtn.setAttribute('aria-expanded',on?'true':'false');if(on)impTxt.focus();else impMsg.textContent='';}
    impBtn.addEventListener('click',function(){showImp(imp.hidden);});
    document.getElementById('scImpCancel').addEventListener('click',function(){showImp(false);impBtn.focus();});
    document.getElementById('scImpGo').addEventListener('click',function(){
      var o;
      try{o=JSON.parse(impTxt.value);}catch(e){impMsg.textContent='That is not valid JSON. Paste the whole text from Copy as JSON.';return;}
      if(!o||typeof o!=='object'||!o.states||typeof o.states!=='object'){impMsg.textContent='No scores found. The JSON needs a "states" object keyed by service id.';return;}
      var n=clean({name:o.platform!=null?String(o.platform):o.name,compare:o.compare,states:o.states});
      var count=Object.keys(n.states).length, note=o.version&&o.version!==CM.DATA.version?' It was made against model '+String(o.version)+'; ids were matched against '+CM.DATA.version+'.':'';
      S=n;save();CM.rerender();
      var m2=document.getElementById('scMsg');if(m2)m2.textContent='Imported '+count+' scored services'+(n.name?' for '+n.name:'')+'.'+note;
    });
    var rs=document.getElementById('scReset'), ask=document.getElementById('scResetAsk');
    rs.addEventListener('click',function(){rs.hidden=true;ask.hidden=false;document.getElementById('scResetNo').focus();});
    document.getElementById('scResetNo').addEventListener('click',function(){ask.hidden=true;rs.hidden=false;rs.focus();});
    document.getElementById('scResetYes').addEventListener('click',function(){
      S=blank();save();CM.rerender();
      var m2=document.getElementById('scMsg');if(m2)m2.textContent='All scores cleared.';
    });
  }

  CM.addRoute(/^score$/,view,'score',after);
  CM.addNav('Score','#score','score');
})();


  render();
})();
</script>

</body></html>
