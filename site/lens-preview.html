<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>AI Platform Capability Landscape v1 · 2026-10-18 · Pete Corcoran</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* One landscape with lenses. A persistent tree on the left, the map in the middle, lenses that shade the map
     by platform, prevalence, or pattern. Detail pages drill into an area, a capability, or a service. */
  :root{
    --ground:#EAEEF2; --surface:#FFFFFF; --surface-2:#F2F5F8; --ink:#101821; --muted:#57646F; --faint:#7E8B97;
    --line:#D3DBE3; --line-soft:#E3E9EE; --accent:#C2410C; --on-hue:#FFFFFF; --focus:#C2410C;
    --a1:#3D6098; --a2:#2F8071; --a3:#8A5A2B; --a4:#8B3A62; --a5:#5B6B2E; --a6:#4B5A8F; --a7:#556170; --a8:#7A4F3A;
    --series:#2a78d6; --series-ink:#FFFFFF; --cover-bg:#E2EBF4; --cover-line:#2a78d6; --miss-line:#C9D2DB; --open-line:#9AA5B1;
    --pv-wide:#2a78d6; --pv-mixed:#6da7ec; --pv-rare:#b8cfe9; --pv-host:#9A7BC4; --pv-open:#B9C2CB;
    --display:"Archivo",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
    --grid:#E3E9EE; --axis:#C3CCD5;
    --shadow:0 1px 2px rgba(16,24,33,.05),0 6px 18px rgba(16,24,33,.05);
    --top:56px; --rail:236px;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0D1218; --surface:#151C24; --surface-2:#1B242E; --ink:#E7ECF1; --muted:#98A5B1; --faint:#7A8793;
    --line:#28313C; --line-soft:#202832; --accent:#F97316; --on-hue:#0D1218; --focus:#F97316;
    --a1:#6C93C9; --a2:#4FB9A5; --a3:#C79256; --a4:#C77299; --a5:#9BB05A; --a6:#8494C8; --a7:#8593A1; --a8:#C18A70;
    --series:#3987e5; --series-ink:#FFFFFF; --cover-bg:#14202D; --cover-line:#3987e5; --miss-line:#2E3843; --open-line:#6B7682;
    --pv-wide:#3987e5; --pv-mixed:#2b5fa8; --pv-rare:#25406a; --pv-host:#7B5FB0; --pv-open:#3A4552;
    --grid:#202832; --axis:#2E3843;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    color-scheme:dark;
    --ground:#0D1218; --surface:#151C24; --surface-2:#1B242E; --ink:#E7ECF1; --muted:#98A5B1; --faint:#7A8793;
    --line:#28313C; --line-soft:#202832; --accent:#F97316; --on-hue:#0D1218; --focus:#F97316;
    --a1:#6C93C9; --a2:#4FB9A5; --a3:#C79256; --a4:#C77299; --a5:#9BB05A; --a6:#8494C8; --a7:#8593A1; --a8:#C18A70;
    --series:#3987e5; --series-ink:#FFFFFF; --cover-bg:#14202D; --cover-line:#3987e5; --miss-line:#2E3843; --open-line:#6B7682;
    --pv-wide:#3987e5; --pv-mixed:#2b5fa8; --pv-rare:#25406a; --pv-host:#7B5FB0; --pv-open:#3A4552;
    --grid:#202832; --axis:#2E3843;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ground)}
  a{color:var(--accent)}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;text-wrap:balance;margin:0}
  .mono{font-family:var(--mono)}
  .eyebrow{font-family:var(--mono);font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .eyebrow a{color:inherit;text-decoration:none}
  .lede{color:var(--muted);max-width:70ch;margin:8px 0 0}
  .lede b{color:var(--ink);font-weight:600}
  .measure{max-width:70ch}

  /* top bar */
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft)}
  .top .bar{display:flex;align-items:center;gap:10px;min-height:var(--top);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
  .brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;letter-spacing:-.02em;font-size:1rem;color:var(--ink);text-decoration:none;white-space:nowrap}
  .brand svg{width:24px;height:24px;flex:none}
  .brand small{font-family:var(--mono);font-weight:600;font-size:.62rem;color:var(--faint);letter-spacing:.08em;margin-left:4px;white-space:nowrap}
  @media (max-width:1100px){.brand small{display:none}}
  .menu{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-family:var(--mono);font-size:.7rem;cursor:pointer}
  .top .spacer{flex:1}
  .search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;width:min(360px,100%)}
  .search input{border:0;background:transparent;font:inherit;font-size:.86rem;color:var(--ink);outline:0;width:100%;min-width:0}
  .search input::placeholder{color:var(--faint)}
  .search kbd{font-family:var(--mono);font-size:.62rem;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 5px}
  .toggle{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.7rem;background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap}
  .toggle:hover{color:var(--ink);border-color:var(--muted)}
  a.toggle.repo{text-decoration:none}
  @media (max-width:560px){a.toggle.repo svg{display:none}}

  /* shell: rail + main */
  .shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);max-width:1800px;margin:0 auto}
  .rail{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));height:calc(100vh - var(--top) - env(safe-area-inset-top,0px));overflow:auto;padding:14px 10px 24px max(12px,env(safe-area-inset-left,0px));border-right:1px solid var(--line-soft)}
  .rail .grp{font-family:var(--mono);font-size:.62rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:10px 8px 4px}
  .rail a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-size:.84rem;padding:5px 8px;border-radius:7px;min-width:0}
  .rail a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail a:hover{color:var(--ink);background:var(--surface)}
  .rail a.on{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
  .rail .ra{margin-top:2px}
  .rail .ral{font-weight:600;color:var(--ink)}
  .rail .ral .n{font-family:var(--mono);font-size:.6rem;color:var(--faint);margin-left:auto;font-weight:500;flex:none;overflow:visible}
  .rail .rc{margin-left:14px;border-left:1px solid var(--line-soft);padding-left:4px}
  .rail .rc a{font-size:.8rem;padding:3px 8px}
  main{padding:22px max(16px,env(safe-area-inset-right,0px)) 48px 20px;min-width:0}

  /* icons */
  .ico{display:block;flex:none;width:28px;height:28px;border-radius:7px;object-fit:cover;background:var(--surface-2)}
  .ico.lg{width:52px;height:52px;border-radius:13px}
  .ico.sm{width:22px;height:22px;border-radius:6px}
  .ico.xs{width:16px;height:16px;border-radius:4px}
  .chip .ico{width:14px;height:14px;border-radius:3px}

  /* page head */
  .head{display:flex;flex-wrap:wrap;align-items:end;gap:14px 24px;margin-bottom:16px}
  .head .grow{flex:1;min-width:260px}
  .head h1{font-size:clamp(1.5rem,3.2vw,2.1rem);line-height:1.08}
  .hrow{display:flex;align-items:center;gap:14px}
  .crumbs{display:flex;flex-wrap:wrap;gap:4px 6px;font-family:var(--mono);font-size:.7rem;color:var(--faint);margin-bottom:8px}
  .crumbs a{color:var(--muted);text-decoration:none}
  .crumbs a:hover{color:var(--accent)}
  .scope{color:var(--muted);font-size:.86rem;max-width:70ch;margin:8px 0 0}
  .scope b{color:var(--ink);font-weight:600}
  .owner{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.66rem;font-weight:600;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:2px 9px;margin-top:10px}
  .owner::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .counts{font-family:var(--mono);font-size:.68rem;color:var(--faint)}
  .counts b{color:var(--muted);font-weight:600}

  /* controls */
  .seg{display:inline-flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;max-width:100%}
  .seg a,.seg button{font-family:var(--mono);font-size:.7rem;font-weight:600;color:var(--muted);text-decoration:none;padding:5px 12px;border-radius:999px;border:0;background:transparent;cursor:pointer}
  .seg .on{background:var(--ink);color:var(--ground)}
  select{font:inherit;font-size:.8rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 9px;max-width:100%}
  .lensbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 0 14px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
  .lensbar label{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .lensbar .hint{font-size:.8rem;color:var(--muted);margin-left:auto}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:.68rem;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:2px 7px;text-decoration:none}
  .chip:hover{color:var(--ink);border-color:var(--muted)}
  .chip.cur{color:var(--ink);border-color:var(--ink)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.76rem;color:var(--muted);margin:0 0 12px}
  .legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}

  /* tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tile{background:var(--surface);border:1px solid var(--line);border-left-width:3px;border-radius:7px;padding:9px 10px;box-shadow:var(--shadow);text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:3px;min-width:0;position:relative}
  .tile:hover{border-color:var(--muted)}
  .tile .tn{font-weight:600;font-size:.84rem;line-height:1.2}
  .tile .tm{font-family:var(--mono);font-size:.64rem;color:var(--faint);line-height:1.3}
  .tile .tm b{color:var(--muted);font-weight:600}
  .tile .td{font-size:.78rem;color:var(--muted);line-height:1.35}
  .tile .pv{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%}
  /* lens states */
  .tile.cov{background:var(--cover-bg);border-left-color:var(--cover-line)}
  .tile.cov::after{content:"";position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--cover-line)}
  .tile.miss{border-left-color:var(--miss-line);box-shadow:none}
  .tile.miss .tn{color:var(--muted);font-weight:500}
  .tile.unclaimed{border-style:dashed;border-left-style:solid;border-left-color:var(--open-line);box-shadow:none}
  .tile.unclaimed .tn{color:var(--muted);font-weight:500}
  .tile.dim{opacity:.42;box-shadow:none}
  .tile.hit{border-color:var(--accent);border-left-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
  .tile.hit .tm b{color:var(--accent)}

  /* landscape */
  .land{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;align-items:start}
  .col{display:flex;flex-direction:column;gap:8px;min-width:0}
  .ahead{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px) + 6px);z-index:5;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 11px;border-radius:9px;color:var(--on-hue);box-shadow:var(--shadow)}
  .ahead a{color:inherit;text-decoration:none}
  .ahead .an{font-family:var(--mono);font-weight:600;font-size:.62rem;letter-spacing:.08em;opacity:.85}
  .ahead h2{font-size:.92rem;line-height:1.15}
  .ahead .ct{font-family:var(--mono);font-size:.62rem;opacity:.85}
  .ahead .ico{margin-bottom:4px}
  .dom{display:flex;flex-direction:column;gap:6px}
  .dhead{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.62rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:4px 2px 0}
  .dhead a{color:inherit;text-decoration:none}
  .dhead a:hover{color:var(--accent)}
  .land .tile .tn{font-size:.79rem}
  .phead{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px) + 6px);z-index:5;background:var(--ink);color:var(--ground);border-radius:9px;padding:9px 11px;box-shadow:var(--shadow)}
  .phead h2{font-size:.92rem}
  .phead .ct{font-family:var(--mono);font-size:.62rem;opacity:.8}
  .land.bypat{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}

  /* platform panel (platform lens) */
  .ppanel{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;margin-bottom:14px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
  .panel .lab{font-family:var(--mono);font-size:.64rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.82rem;margin-top:10px}
  .kv dt{font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding-top:3px}
  .kv dd{margin:0;color:var(--ink);min-width:0;overflow-wrap:anywhere}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
  .stat .n{font-weight:600;font-size:1.6rem;line-height:1}
  .stat .k{font-size:.74rem;color:var(--muted);margin-top:5px}
  .stat .src{font-family:var(--mono);font-size:.62rem;color:var(--faint);margin-top:4px}
  .bars{display:flex;flex-direction:column;gap:7px;margin-top:10px}
  .brow{display:grid;grid-template-columns:minmax(120px,170px) 1fr auto;gap:10px;align-items:center;font-size:.8rem}
  .brow .bl{display:flex;align-items:center;gap:7px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap}
  .brow .bl span{overflow:hidden;text-overflow:ellipsis}
  .brow .bt{height:10px;background:var(--surface-2);border-radius:4px;overflow:hidden;position:relative}
  .brow .bf{position:absolute;inset:0 auto 0 0;background:var(--series);border-radius:0 4px 4px 0}
  .brow .bv{font-family:var(--mono);font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  details.lists{margin-top:10px}
  details.lists summary{cursor:pointer;font-family:var(--mono);font-size:.7rem;color:var(--muted)}
  .lists .two{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}
  .lists ul{margin:6px 0 0;padding-left:18px;font-size:.84rem;color:var(--muted)}
  .lists li a{color:var(--ink);text-decoration:none}
  .lists li a:hover{color:var(--accent)}
  .lists .h{font-family:var(--mono);font-size:.66rem;color:var(--faint)}
  .ptabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .ptab{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 5px;text-decoration:none;color:var(--muted);font-size:.8rem}
  .ptab .pc{font-family:var(--mono);font-size:.64rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:1px 7px;color:var(--ink)}
  .ptab.on{border-color:var(--ink);color:var(--ink)}
  .ptab.on .pc{background:var(--ink);color:var(--ground);border-color:var(--ink)}

  /* area, capability, index pages */
  .cblock{margin-top:22px}
  .chead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .chead h3{font-size:1rem;display:inline-flex;align-items:center;gap:7px}
  .chead > p{flex-basis:100%;margin:0;color:var(--muted);font-size:.84rem}
  .chead h3 a{color:inherit;text-decoration:none}
  .chead h3 a:hover{color:var(--accent)}
  .chead .owner{margin:0}
  .cabil{color:var(--muted);font-size:.86rem;max-width:70ch;margin:0 0 10px}
  .cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .ccard{background:var(--surface);border:1px solid var(--line);border-left-width:3px;border-radius:9px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0;text-decoration:none;color:inherit}
  .ccard:hover{border-color:var(--muted)}
  .ccard .t{display:flex;align-items:center;gap:9px}
  .ccard h3{font-size:.96rem}
  .ccard p{margin:0;color:var(--muted);font-size:.82rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .ccard .f{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:auto;font-family:var(--mono);font-size:.64rem;color:var(--faint)}
  .asec{margin-top:24px}
  .ahd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .ahd h2{font-size:1.05rem}
  .ahd h2 a{color:inherit;text-decoration:none}
  .ahd .ct{font-family:var(--mono);font-size:.64rem;color:var(--faint);margin-left:auto}
  /* service map (mermaid) */
  .dia{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);margin:0 0 18px}
  .dia .dhd{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:8px}
  .dia .dhd .lab{margin:0}
  .dia .dhd label{font-size:.8rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .dia .dhd .note{font-size:.78rem;color:var(--faint);margin-left:auto}
  .dia .xp{display:inline-flex;align-items:center;gap:6px}
  .dia .xp .lab{margin:0}
  .dia .xbtn{font-family:var(--mono);font-size:.66rem;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:2px 8px;cursor:pointer}
  .dia .xbtn:hover{color:var(--ink);border-color:var(--muted)}
  .dia .xst{font-size:.74rem;color:var(--muted)}
  .dia .out{overflow:auto;min-height:60px}
  .dia .out svg{max-width:none;height:auto;display:block}
  .dia .out .err{color:var(--muted);font-size:.84rem;padding:8px 0}
  .dia details{margin-top:8px}
  .dia summary{cursor:pointer;font-family:var(--mono);font-size:.68rem;color:var(--muted)}
  .dia pre{font-family:var(--mono);font-size:.7rem;line-height:1.45;color:var(--muted);background:var(--surface-2);border-radius:7px;padding:10px 12px;overflow:auto;margin:8px 0 0;max-height:320px}
  .dia table.el{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:8px}
  .dia table.el th{text-align:left;font-family:var(--mono);font-size:.62rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:4px 8px 4px 0;border-bottom:1px solid var(--line-soft)}
  .dia table.el td{padding:4px 8px 4px 0;border-bottom:1px solid var(--line-soft);vertical-align:top;color:var(--muted)}
  .dia table.el td a{color:var(--ink);text-decoration:none}
  .dia .key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.74rem;color:var(--muted);margin-top:8px}
  .dia .key i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
  .pn{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
  .pn a{font-size:.84rem;text-decoration:none;color:var(--muted)}
  .pn a:hover{color:var(--accent)}

  /* service page */
  .svc{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
  .svc .panel h1{font-size:clamp(1.4rem,3vw,1.9rem)}
  .svc .meta{font-family:var(--mono);font-size:.72rem;color:var(--faint);margin:8px 0 12px}
  .svc .meta b{color:var(--muted);font-weight:600}
  .svc p.desc{font-size:1.02rem;margin:0;max-width:62ch}
  .sec{margin-top:20px;padding-top:14px;border-top:1px solid var(--line-soft)}
  .sec .num{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--ground);font-size:.6rem;margin-right:8px}
  .ov{display:grid;grid-template-columns:minmax(120px,160px) 1fr;gap:6px 14px;margin:0;font-size:.86rem}
  .ov dt{font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding-top:3px}
  .ov dd{margin:0;color:var(--ink)}
  .ov .ex{display:block;color:var(--muted);margin-top:4px}
  .fl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
  .fl li{font-size:.86rem;display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:12px}
  .fl li b{font-weight:600}
  .fl li span{color:var(--muted)}
  .ifh{font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:10px 0 6px}
  table.ifc{width:100%;border-collapse:collapse;font-size:.82rem}
  table.ifc th{text-align:left;font-family:var(--mono);font-size:.62rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:4px 8px 4px 0;border-bottom:1px solid var(--line-soft)}
  table.ifc td{padding:5px 8px 5px 0;border-bottom:1px solid var(--line-soft);vertical-align:top;color:var(--muted)}
  table.ifc td:first-child{color:var(--ink);font-weight:600}
  table.ifc td a{color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--faint)}
  .side{display:flex;flex-direction:column;gap:12px}
  .side .panel{padding:14px 16px}
  .side p{margin:0;font-size:.84rem;color:var(--muted)}
  .plist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
  .plist li{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
  .plist li .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--miss-line);flex:none}
  .plist li.on{color:var(--ink)}
  .plist li.on .dot{background:var(--series);border-color:var(--series)}
  .plist li small{font-family:var(--mono);font-size:.62rem;color:var(--faint)}
  .evid{font-family:var(--mono);font-size:.7rem;color:var(--faint);margin-top:10px;line-height:1.5}

  /* matrix page */
  .dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
  .drow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
  .card h2{font-size:1rem;margin-bottom:2px}
  .card .sub{font-size:.8rem;color:var(--muted);margin:0 0 12px}
  .hbars{display:flex;flex-direction:column;gap:7px}
  .hbar{display:grid;grid-template-columns:132px 1fr;gap:10px;align-items:center;font-size:.82rem}
  .hbar .l{color:var(--ink);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
  .hbar .l small{font-family:var(--mono);font-size:.64rem;color:var(--faint);margin-left:4px}
  .hbar .t{position:relative;height:14px;border-left:1px solid var(--line)}
  .hbar .f{position:absolute;left:0;top:2px;bottom:2px;background:var(--series);border-radius:0 4px 4px 0;min-width:2px}
  .hbar .v{position:absolute;top:-2px;font-family:var(--mono);font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:6px;white-space:nowrap}
  .hm{width:100%;border-collapse:separate;border-spacing:2px;font-size:.78rem;table-layout:fixed}
  .hm th{font-family:var(--mono);font-size:.64rem;font-weight:600;color:var(--muted);text-align:left;padding:2px 4px;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hm th.r{text-align:center}
  .hm th .rl{display:flex;align-items:center;gap:6px}
  .hm td{height:34px;text-align:center;border-radius:4px;font-family:var(--mono);font-size:.7rem;font-variant-numeric:tabular-nums}
  .ramp{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.64rem;color:var(--faint);margin-top:8px}
  .ramp .r{flex:0 0 120px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--surface-2),var(--series))}
  .stack{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px;margin-top:6px}
  .stack a{min-width:2px;display:block}
  .skey{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--muted);margin-top:8px}
  .skey .sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
  .filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 12px}
  .filters label{font-size:.8rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .mwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
  .mx{border-collapse:collapse;min-width:760px;width:100%;font-size:.8rem}
  .mx th{position:sticky;top:0;background:var(--surface);z-index:1;font-family:var(--mono);font-size:.64rem;font-weight:600;letter-spacing:.04em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  .mx th.c{text-align:center;width:48px}
  .mx td{padding:5px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  .mx td.c{text-align:center}
  .mx tr.grp td{background:var(--surface-2);font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px}
  .mx tr.grp td .gl{display:flex;align-items:center;gap:8px}
  .mx td.nm a{color:var(--ink);text-decoration:none}
  .mx td.nm a:hover{color:var(--accent)}
  .mx td.nm small{display:block;font-family:var(--mono);font-size:.62rem;color:var(--faint)}
  .mx .dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--miss-line)}
  .mx .dot.on{background:var(--series);border-color:var(--series)}
  .mx tr.hl td{background:var(--cover-bg)}
  .mx td.tot{font-family:var(--mono);font-size:.7rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
  .mx tr.open td.nm a{color:var(--muted)}
  .pvb{font-family:var(--mono);font-size:.62rem;font-weight:600;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted);white-space:nowrap}
  .pvb.open{border-style:dashed}

  .tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--ground);font-size:.76rem;line-height:1.35;padding:6px 9px;border-radius:6px;max-width:260px;box-shadow:var(--shadow)}
  .tip b{font-weight:600}
  footer{color:var(--faint);font-size:.74rem;margin-top:36px;border-top:1px solid var(--line-soft);padding-top:14px}
  footer p{margin:0 0 4px}
  .empty{color:var(--muted);font-size:.9rem;padding:24px 0}
  .res h2{font-size:1rem;margin:16px 0 8px}

  @media (max-width:1500px){.land{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @media (max-width:1200px){.tiles{grid-template-columns:repeat(3,1fr)}.cgrid{grid-template-columns:repeat(2,1fr)}.dgrid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:900px){
    .shell{grid-template-columns:1fr}
    .menu{display:inline-block}
    .rail{position:fixed;left:0;top:calc(var(--top) + env(safe-area-inset-top,0px));bottom:0;width:min(300px,86vw);background:var(--ground);z-index:35;transform:translateX(-100%);transition:transform .18s ease;box-shadow:var(--shadow)}
    body.nav-open .rail{transform:none}
    main{padding-left:max(16px,env(safe-area-inset-left,0px))}
    .svc,.ppanel,.drow,.lists .two{grid-template-columns:1fr}
    .land{grid-template-columns:repeat(2,minmax(0,1fr))}
    .tiles{grid-template-columns:repeat(2,1fr)}
    .search{width:auto;flex:1;min-width:120px}
    .search kbd{display:none}
  }
  @media (max-width:560px){
    .land,.tiles,.cgrid,.stats,.dgrid,.plist{grid-template-columns:1fr}
    .hbar{grid-template-columns:96px 1fr}.brow{grid-template-columns:90px 1fr auto}
    .brand small{display:none}
    .lensbar .hint{margin-left:0}
    .fl li,.ov{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
  /* download control on the map */
  .dl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .dl .lab{font-family:var(--mono);font-size:.64rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .dl .dlst{font-size:.74rem;color:var(--muted);flex-basis:100%;min-height:1em}
  /* print mode (#map?print=1): no chrome, light theme, eight fixed columns; used by render-map.js */
  body.print .top,body.print .rail,body.print .lensbar,body.print .dl,body.print .tip{display:none!important}
  body.print .shell{grid-template-columns:1fr;max-width:none}
  body.print main{padding:30px 34px 26px}
  body.print .land{grid-template-columns:repeat(8,minmax(0,1fr))!important;gap:12px}
  body.print .ahead{position:static;box-shadow:none}
  body.print .tile{box-shadow:none;break-inside:avoid}
  body.print *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @media print{body.print{background:var(--ground)}body.print main{padding:0 10px}}
  /* full-width area header used by the plug-in views */
  .ahead.row{position:static;flex-direction:row;align-items:center;gap:10px;margin-bottom:12px;box-shadow:none}
  .ahead.row .ct{margin-left:auto}
  .ahead.row .ico{margin:0}
  .csec{margin-top:14px}
/* views/data.css */
  /* Data view (#data) */
  .dv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .dv-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
  .dv-wide{grid-column:1 / -1}
  .dv-card h2{font-size:1.05rem;margin-bottom:8px}
  .dv-card p{margin:0 0 10px;color:var(--muted);font-size:.9rem;max-width:75ch}
  .dv-card p b{color:var(--ink);font-weight:600}
  .dv-card p:last-child{margin-bottom:0}
  .dv-note{font-size:.8rem!important;color:var(--faint)!important}
  .dv-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .dv-btn{font-family:var(--mono);font-size:.76rem;font-weight:600;color:var(--ground);background:var(--ink);border:1px solid var(--ink);border-radius:999px;padding:8px 15px;cursor:pointer}
  .dv-btn:hover{background:var(--accent);border-color:var(--accent)}
  .dv-status{font-family:var(--mono);font-size:.74rem;color:var(--accent);min-height:1em}
  .dv-text{display:block;width:100%;height:180px;margin-top:4px;font-family:var(--mono);font-size:.72rem;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:8px;resize:vertical}
  .dv-tw{overflow-x:auto;margin-bottom:10px}
  .dv-t{border-collapse:collapse;width:100%;font-size:.86rem}
  .dv-t th{text-align:left;font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:6px 10px 6px 0;border-bottom:1px solid var(--line)}
  .dv-t td{padding:7px 10px 7px 0;border-bottom:1px solid var(--line-soft);color:var(--ink)}
  .dv-t td.mono{font-family:var(--mono);color:var(--accent);white-space:nowrap}
  .dv-cite{font-family:var(--mono);font-size:.78rem!important;color:var(--ink)!important;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:7px;padding:9px 11px;overflow-wrap:anywhere}
  .dv-files{list-style:none;margin:0 0 10px;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}
  .dv-files li{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line-soft);min-width:0}
  .dv-files .mono{font-size:.8rem;font-weight:600;color:var(--ink)}
  .dv-files li > span:last-child{font-size:.84rem;color:var(--muted)}
  @media (max-width:760px){.dv,.dv-files{grid-template-columns:1fr}}

/* views/graph.css */
  /* service dependency graph (views/graph.js) */
  .gv-stats{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;font-size:.82rem;color:var(--muted);margin:0 0 12px}
  .gv-stats b{font-family:var(--body);font-weight:600;font-size:1.25rem;color:var(--ink);font-variant-numeric:tabular-nums}
  .gv-stats small{font-family:var(--mono);font-size:.66rem;color:var(--faint)}
  .gv-hubs{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;min-width:0}
  .gv-hubs a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
  .gv-hubs a:hover{color:var(--accent);border-color:var(--accent)}
  .gv-filters{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
  .gv-chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .gv-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.68rem;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 7px;cursor:pointer}
  .gv-chip:hover{color:var(--ink);border-color:var(--muted)}
  .gv-chip[aria-pressed="false"]{background:transparent;color:var(--faint);text-decoration:line-through;border-style:dashed}
  .gv-chip[aria-pressed="false"] .gv-sw{opacity:.3}
  .gv-sw{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
  .gv-sw-actor{border-radius:2px;border:1.5px solid var(--muted);background:transparent}
  .gv-sw-open{border:1.5px dashed var(--muted);background:transparent}
  .gv-mech{font-family:var(--mono);font-size:.68rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px;margin-left:4px;max-width:100%}
  .gv-mech select{font:inherit;font-size:.74rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 6px;max-width:100%;min-width:0}

  .gv-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
  .gv-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
  .gv-stage{position:relative;aspect-ratio:1600/1100;width:100%}
  .gv-svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  .gv-dragging .gv-svg{cursor:grabbing}
  .gv-bg{fill:transparent}
  .gv-hint{margin:0;padding:7px 12px;border-top:1px solid var(--line-soft);font-family:var(--mono);font-size:.64rem;color:var(--faint)}
  .gv-zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
  .gv-zoom button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:var(--mono);font-size:.9rem;font-weight:600;cursor:pointer;padding:0;line-height:1}
  .gv-zoom button#gv-reset{font-size:.6rem}
  .gv-zoom button:hover{color:var(--ink);border-color:var(--muted)}

  .gv-edges line{stroke:var(--line);fill:none}
  .gv-edges line.gv-hl{stroke:var(--muted);stroke-opacity:1}
  .gv-edges line.gv-mx{stroke:var(--accent)}
  .gv-edges line.gv-dim{stroke-opacity:.35}
  .gv-has-act .gv-edges line.gv-dim{stroke-opacity:.18}
  .gv-off{display:none}
  .gv-n{cursor:pointer;outline:none}
  .gv-n circle{stroke:var(--surface);stroke-width:1.5}
  .gv-n.gv-openn circle{fill-opacity:.28;stroke-width:1.5;stroke-dasharray:3 2.5}
  .gv-n.gv-actor rect{fill:var(--surface);stroke:var(--muted);stroke-width:1.6}
  .gv-n.gv-dim{opacity:.22}
  .gv-n.gv-act circle,.gv-n.gv-act rect{stroke:var(--ink);stroke-width:2.5}
  .gv-n.gv-sel circle,.gv-n.gv-sel rect{stroke:var(--accent);stroke-width:3;stroke-dasharray:none}
  .gv-n:focus-visible circle,.gv-n:focus-visible rect{stroke:var(--focus);stroke-width:3}

  .gv-labels{pointer-events:none;font-family:var(--body)}
  .gv-l{display:none;fill:var(--muted);font-weight:500;paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
  .gv-l.gv-always,.gv-zoomed .gv-l,.gv-l.gv-show{display:inline}
  .gv-l.gv-lhub{fill:var(--ink);font-weight:600}
  .gv-l.gv-dim{opacity:.25}
  .gv-has-act .gv-l.gv-dim{display:none}
  .gv-has-act .gv-l.gv-dim.gv-lhub{display:inline;opacity:.3}
  .gv-l.gv-show{fill:var(--ink)}
  .gv-l.gv-lact{fill:var(--ink);font-weight:700}
  .gv-l.gv-off{display:none}

  .gv-panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);min-width:0;font-size:.84rem;max-height:calc(100vh - 120px);overflow:auto;position:sticky;top:70px}
  .gv-panel .lab{font-family:var(--mono);font-size:.64rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:14px 0 6px}
  .gv-panel .lab:first-child{margin-top:0}
  .gv-panel h2{font-size:1.15rem;line-height:1.2;margin:4px 0 4px}
  .gv-panel h2 a{color:var(--ink);text-decoration:none}
  .gv-panel h2 a:hover{color:var(--accent)}
  .gv-pid{font-family:var(--mono);font-size:.66rem;color:var(--faint);display:flex;align-items:center;gap:6px}
  .gv-pmeta{font-family:var(--mono);font-size:.7rem;color:var(--faint)}
  .gv-pmeta b{color:var(--muted);font-weight:600}
  .gv-pdesc{margin:8px 0 0;color:var(--muted)}
  .gv-deg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:10px;font-family:var(--mono);font-size:.7rem;color:var(--faint)}
  .gv-deg b{font-family:var(--body);font-size:1rem;color:var(--ink);font-weight:600}
  .gv-focus{margin-left:auto;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:999px;padding:2px 10px}
  .gv-clear{font-family:var(--mono);font-size:.68rem;background:transparent;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);cursor:pointer}
  .gv-rel{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
  .gv-rel li{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;line-height:1.3}
  .gv-rel li a{color:var(--ink);text-decoration:none}
  .gv-rel li a:hover{color:var(--accent)}
  .gv-rel small{flex-basis:100%;padding-left:14px;font-family:var(--mono);font-size:.62rem;color:var(--faint)}
  .gv-dot{width:8px;height:8px;border-radius:50%;flex:none}
  .gv-dot-actor{border-radius:1px;border:1.5px solid var(--muted)}
  .gv-actorname{color:var(--muted)}
  .gv-go{background:none;border:0;padding:0 2px;color:var(--faint);cursor:pointer;font-size:.8rem;line-height:1}
  .gv-go:hover{color:var(--accent)}
  .gv-none{margin:0;color:var(--faint);font-size:.8rem}
  .gv-legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
  .gv-legend li{display:flex;align-items:center;gap:8px}
  .gv-legend svg{flex:none}
  .gv-legend-open{fill:var(--a1);fill-opacity:.28;stroke:var(--a1);stroke-width:1.5;stroke-dasharray:3 2.5}
  .gv-legend-actor{fill:var(--surface);stroke:var(--muted);stroke-width:1.6}
  .gv-legend-edge{stroke:var(--muted);stroke-width:1.2}

  @media (max-width:900px){.gv-grid{grid-template-columns:1fr}.gv-panel{position:static;max-height:none}}

/* views/score.css */
  /* score: self-assessment of a platform against every service */
  .scid-form{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end;min-width:0;max-width:100%}
  .scfield{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:100%}
  .scfield span{font-family:var(--mono);font-size:.64rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .scfield input,.scfield select,.scbulk select{font:inherit;font-size:.86rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0;max-width:100%}
  .scfield input{width:240px}
  .scfield input::placeholder{color:var(--faint)}

  .sccard{margin-bottom:12px;border-top:4px solid var(--series)}
  .sccard .scname{font-size:1.35rem;margin:4px 0 12px;overflow-wrap:anywhere}
  .sccard .lab{font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 4px}
  .scgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px;align-items:start}
  .scstats .stat{box-shadow:none;background:var(--surface-2)}
  .scstats .src{overflow-wrap:anywhere}
  .scstates{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted);margin-top:12px}
  .scstates b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;margin-left:2px}
  .scstates .sw,.sclegend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}
  .sw.observed,.sw.sc-observed,.bf.sc-observed{background:var(--series)}
  .sw.configured,.sw.sc-configured,.bf.sc-configured{background:color-mix(in srgb,var(--series) 68%,var(--surface-2))}
  .sw.shipped,.sw.sc-shipped,.bf.sc-shipped{background:color-mix(in srgb,var(--series) 40%,var(--surface-2))}
  .sw.absent{background:var(--surface)}
  .sclegend .sw.scmk{width:3px;border:0;background:var(--ink)}
  .sclegend{margin:10px 0 0}
  .scbrow .bl{display:flex;align-items:center;gap:7px}
  .scdot{flex:none;width:8px;height:8px;border-radius:2px}
  .scbrow .bt{height:12px}
  .scbrow .bf{border-radius:0}
  .scmark{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:var(--ink)}
  .scbrow .bv{min-width:62px;text-align:right}
  .scd{display:inline-block;min-width:28px;margin-left:6px;text-align:right;font-weight:600}
  .scd.up{color:var(--series)}
  .scd.dn{color:var(--accent)}
  .scd.eq{color:var(--faint)}
  .sclists{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft)}
  .sclists ul{max-height:260px;overflow-y:auto}

  .scactions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
  .scbtn{font-family:var(--mono);font-size:.72rem;font-weight:600;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
  .scbtn:hover{border-color:var(--muted)}
  .scbtn.warn{color:var(--accent)}
  .scbtn.warn:hover{border-color:var(--accent)}
  .screset{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center}
  .screset > span:not([hidden]){display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center}
  .scq{font-size:.8rem;color:var(--ink)}
  .scmsg{font-size:.8rem;color:var(--muted)}
  .scbox{margin-bottom:12px}
  .scbox .lab{font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
  .scbox textarea{display:block;width:100%;font-family:var(--mono);font-size:.76rem;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;resize:vertical}
  .scbox .scactions{margin:10px 0 0}
  .sckey{margin:6px 0 0}
  .sckey b{color:var(--ink);font-weight:600}

  .scbulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.8rem;color:var(--muted);margin:-4px 0 4px}
  .scbulk select{font-size:.8rem;padding:4px 8px}

  .sctiles{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
  .sctile{box-shadow:none;gap:4px}
  .sctile:hover{border-color:var(--line)}
  .sctile.on{background:var(--cover-bg);box-shadow:var(--shadow)}
  .sctile.open{border-style:dashed;border-left-style:solid}
  .sctile .tn a{color:var(--ink);text-decoration:none}
  .sctile .tn a:hover{color:var(--accent);text-decoration:underline}
  .scid{font-family:var(--mono);font-size:.6rem;font-weight:500;color:var(--faint);margin-left:4px;white-space:nowrap}

  .scseg{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:2px;align-self:flex-start;max-width:100%}
  .scseg input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
  .scseg label{font-family:var(--mono);font-size:.66rem;font-weight:600;color:var(--muted);padding:4px 8px;border-radius:5px;cursor:pointer;user-select:none;border:1px solid transparent}
  .scseg label:hover{color:var(--ink);border-color:var(--line)}
  .scseg input:checked + label{background:var(--surface);color:var(--ink);border-color:var(--line)}
  .scseg input[value="shipped"]:checked + label{background:color-mix(in srgb,var(--series) 28%,var(--surface));border-color:color-mix(in srgb,var(--series) 45%,var(--line))}
  .scseg input[value="configured"]:checked + label{background:color-mix(in srgb,var(--series) 58%,var(--surface));color:var(--ink);border-color:var(--series)}
  .scseg input[value="observed"]:checked + label{background:var(--series);color:var(--series-ink);border-color:var(--series)}
  .scseg input:focus-visible + label{outline:2px solid var(--focus);outline-offset:1px}

  @media (max-width:900px){.scgrid{grid-template-columns:1fr}}
  @media (max-width:560px){
    .scfield,.scfield input,.scfield select{width:100%}
    .scid-form{width:100%}
    .scstats{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
    .scstats .stat{padding:9px 9px}
    .scstats .stat .n{font-size:1.25rem}
    .scstats .stat .k{font-size:.7rem;line-height:1.3}
    .scbrow{grid-template-columns:minmax(0,1fr) auto;gap:3px 10px}
    .scbrow .bt{grid-column:1 / -1;grid-row:2}
    .scseg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-self:stretch}
    .scseg label{text-align:center;padding:5px 2px;font-size:.62rem;overflow:hidden;text-overflow:ellipsis}
  }
